<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>Rings Sport</title>
<!--
  Yedidim, new app. Fully separate from the old app in /v2/.
  - Own storage keys (prefix "yd2.") and own auth storage key, so it never reads or writes the old app's data.
  - Own cloud table (yd_state), locked by row level security to the signed-in owner.
  - No passwords or personal data in this file.
  Note for the old service worker at the site root: this page already handles its own cloud code,
  and the marker text "supabase-sync.js" here tells that worker not to inject the old sync script.
-->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first, one view at a time, fixed bottom bar; sheets slide up for every edit. */
:root{
  --bg:#E9EFEB; --surface:#FFFFFF; --ink:#13251E; --muted:#56665F; --line:#D5DED8;
  --jade:#0E5A43; --jade-2:#13785A; --jade-soft:#DCEDE5;
  --gold:#F2B134; --gold-soft:#FDF0D3; --gold-ink:#7A5000;
  --blue:#2F5E8C; --blue-soft:#E1EBF5; --red:#C23B2A; --red-soft:#F9E1DD;
  --on-dark:#FFFFFF; --veil:rgba(19,37,30,.45);
  --display:"Secular One","Assistant",Arial,sans-serif; --body:"Assistant",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,.num,.big,.disp{font-family:var(--display);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.top h1{font-size:26px;line-height:1.1}
.top small{color:var(--muted);font-size:14px;display:block}
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sync.ok{background:var(--jade-soft);color:var(--jade)} .sync.local{background:var(--gold-soft);color:var(--gold-ink)} .sync.err{background:var(--red-soft);color:var(--red)}
.back{color:var(--jade);font-weight:700;padding:6px 0;margin-bottom:6px;display:inline-block}

/* summary */
.sum{background:var(--jade);color:var(--on-dark);border-radius:20px;padding:16px;margin-bottom:12px}
.sum .lbl{opacity:.85;font-size:15px}
.sum .big{font-size:36px;line-height:1.15}
.sum .split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.sum .split span{display:block;font-size:12px;opacity:.85}
.sum .split b{font-size:17px}
.alert{display:flex;gap:10px;align-items:center;background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:15px}
.sec{font-family:var(--display);font-size:18px;margin:8px 2px 10px}

/* person card in list */
.pc{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.pc .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--jade);color:var(--on-dark);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.pc .hd .nm{flex:1;min-width:0}
.pc .hd b{font-size:18px;display:block}
.chev{color:var(--muted);font-size:22px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;display:inline-block;margin-left:4px}
.tag.n{background:var(--blue-soft);color:var(--blue)} .tag.acc{background:var(--blue-soft);color:var(--blue)} .tag.ok{background:var(--jade-soft);color:var(--jade)} .tag.due{background:var(--gold-soft);color:var(--gold-ink)} .tag.late{background:var(--red-soft);color:var(--red)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--bg);border-radius:12px;padding:8px}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-size:16px;font-variant-numeric:tabular-nums}
.trio.white div{background:var(--surface);border:1px solid var(--line)}

/* loan */
.loan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.loan .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.loan .lh b{font-size:24px}
.loan .lh span{font-size:13px;color:var(--muted);text-align:left}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.terms span{font-size:13px;font-weight:700;background:var(--bg);border-radius:99px;padding:3px 10px}
.terms span.acc{background:var(--blue-soft);color:var(--blue)} .terms span.pay{background:var(--jade-soft);color:var(--jade)}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.split3 div{border-radius:12px;padding:8px 4px}
.split3 span{display:block;font-size:12px;color:var(--muted)}
.split3 b{font-size:16px;font-variant-numeric:tabular-nums}
.split3 .t{background:var(--bg)} .split3 .me{background:var(--jade-soft)} .split3 .me b{color:var(--jade)} .split3 .ag{background:var(--gold-soft)} .split3 .ag b{color:var(--gold-ink)}
.plain{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5;margin-top:10px}
.cli{font-size:13px;color:var(--muted);margin-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:12px 10px;border-radius:12px;font-weight:700;text-align:center;font-size:15px}
.btn.pri{background:var(--jade);color:var(--on-dark)} .btn.sec2{background:var(--surface);border:1.5px solid var(--line)} .btn.dark{background:var(--ink);color:var(--on-dark)} .btn.danger{background:var(--red-soft);color:var(--red)}
.btn.full{display:block;width:100%}
.plan{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.plan>b{font-size:15px;display:block;margin-bottom:6px}
.step{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.step i{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--line)}
.step.acc i{background:var(--blue)} .step.pay i{background:var(--jade)}
.step b{font-size:15px}
.step span{display:block;font-size:13px;color:var(--muted)}
.step .st{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.st.now{background:var(--jade-soft);color:var(--jade)} .st.fut{background:var(--gold-soft);color:var(--gold-ink)} .st.past{background:var(--bg);color:var(--muted)}
.more-link{color:var(--jade);font-weight:700;font-size:14px;margin-top:8px;display:inline-block;padding:4px 0}

/* ledger */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ledger td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger tr:last-child td{border:0}
.ledger td.k{font-weight:700}
.pay-list .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay-list .row:last-child{border:0}
.pay-list .row span{color:var(--muted);font-size:13px;display:block}
.x{color:var(--red);font-weight:700;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:24px 10px;line-height:1.6}
.ex{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}

/* settings */
.set .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.set .row:last-child{border:0}
.set .row b{display:block}
.set .row span{display:block;font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;min-width:56px;padding:4px}
/* Gate: full-bleed banknote-green screen; a guilloche seal behind the name is the one ornament. */
.gt{position:fixed;inset:0;z-index:5;overflow:auto;background:radial-gradient(120% 70% at 50% 0%,#13785A 0%,#0E5A43 45%,#08382A 100%);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px)}
.gt-bar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.gt-bar small{font-size:15px;color:rgba(255,255,255,.72)}
.gt-set{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.8);background:rgba(255,255,255,.08)}
.gt-set svg{width:22px;height:22px}
.gt-back{color:var(--gold);font-weight:700;font-size:17px;padding:8px 0}
.gt-head{position:relative;text-align:center;padding:26px 0 30px}
.gt-seal{position:absolute;left:50%;top:50%;width:250px;height:250px;transform:translate(-50%,-50%);color:var(--gold);opacity:.22;pointer-events:none}
.gt-name{position:relative;font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.gt-hi{position:relative;font-size:19px;font-weight:600;margin-top:10px;color:rgba(255,255,255,.9)}
.gt-btns{flex:1;display:flex;flex-direction:column;gap:14px;min-height:340px}
.gt-b{position:relative;flex:1;width:100%;border-radius:28px;padding:22px 22px 20px;display:flex;flex-direction:column;text-align:right;overflow:hidden}
.gt-b .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.gt-b .ic svg{width:30px;height:30px}
.gt-b .tx{margin-top:auto;padding-left:56px}
.gt-b b{display:block;font-family:var(--display);font-weight:400;font-size:31px;line-height:1.12}
.gt-b .tx span{display:block;font-size:16px;margin-top:4px}
.gt-b .go{position:absolute;left:20px;bottom:20px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1}
.gt-b:active{transform:scale(.985)}
.gt-b.b1{background:var(--gold);color:#13251E;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.gt-b.b1 .ic{background:#0E5A43;color:var(--gold)}
.gt-b.b1 .tx span{color:#5a3d00}
.gt-b.b1 .go{background:#0E5A43;color:var(--gold)}
.gt-b.b2{background:rgba(255,255,255,.07);border:1.5px solid rgba(242,177,52,.45);color:#fff}
.gt-b.b2 .ic{background:rgba(242,177,52,.16);color:var(--gold)}
.gt-b.b2 .tx span{color:rgba(255,255,255,.75)}
.gt-b.b2 .go{border:1.5px solid rgba(242,177,52,.6);color:var(--gold)}
.gt-b.b2 .gt-pend{display:block;margin:0;position:absolute;top:22px;left:20px;background:var(--gold);color:#13251E;font-weight:700;font-size:14px;border-radius:99px;padding:5px 12px}
.gate-hi small{color:var(--muted);font-size:14px}
.gate-hi h1{margin:2px 0 16px}
.tile{display:block;width:100%;border-radius:20px;padding:16px;margin-bottom:12px;text-align:right}
.tile .tt{font-family:var(--display);font-size:21px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile.t1{background:var(--jade);color:var(--on-dark)}
.tile.t1 .lbl{opacity:.85;font-size:14px;margin-top:8px}
.tile.t1 .big{font-family:var(--display);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.t1 .row{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:14px}
.tile.t1 .row b{display:block;font-size:17px}
.tile.t2{background:var(--surface);border:1px solid var(--line)}
.tile.t2 p{color:var(--muted);font-size:15px;margin-top:4px}
.tile .pill{background:var(--gold-soft);color:var(--gold-ink);border-radius:20px;padding:3px 10px;font-family:var(--body);font-weight:700;font-size:13px;white-space:nowrap}
.tile .pill.ok{background:var(--jade-soft);color:var(--jade)}
.gate2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gate2 button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;font-weight:700;font-size:16px;text-align:right}
.gate2 span{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--jade)}
.tabs .fab{width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--jade);margin-top:-30px;box-shadow:0 6px 16px rgba(14,90,67,.3);justify-content:center;min-width:0}
.tabs .fab svg{width:28px;height:28px}

/* sheet */
.veil{position:fixed;inset:0;background:var(--veil);z-index:20}
.sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:21}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px;line-height:1.45}
.fl{margin-bottom:12px}
.fl label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fl input,.fl select,.fl textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.fl textarea{min-height:140px;direction:ltr;font-size:13px}
.fl .hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:center;background:var(--surface)}
.opts button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.opts button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.prev{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:10px}
.err{color:var(--red);font-size:14px;font-weight:700;margin-bottom:8px}

/* lock */
.lock{position:fixed;inset:0;background:var(--jade);color:var(--on-dark);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.mark{font-family:var(--display);font-size:44px}
.mark span{color:var(--gold)}
.lock p{opacity:.9;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0 18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.dots i.f{background:var(--on-dark);border-color:var(--on-dark)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:290px}
.pad button{height:58px;border-radius:16px;background:rgba(255,255,255,.12);color:var(--on-dark);font-size:24px;font-family:var(--display);text-align:center}
.pad button:active{background:rgba(255,255,255,.25)}
.lock .msg{min-height:22px;margin-top:12px;color:var(--gold);font-weight:700}
.finger{margin:34px auto 16px;width:116px;height:116px;border-radius:50%;background:var(--gold);color:var(--jade);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(242,177,52,.18)}
.finger svg{width:58px;height:58px}
.lock .help{margin-top:22px;color:var(--on-dark);opacity:.85;text-decoration:underline;font-size:14px;padding:6px}
.agentv{position:fixed;inset:0;z-index:40;background:#E9EFEB;overflow-y:auto;direction:ltr;text-align:left;font-family:"Noto Sans Thai",Tahoma,Arial,sans-serif;color:#13251E}
.agentv[hidden]{display:none}
.av-in{max-width:480px;margin:0 auto;padding:18px 16px 32px}
.av-x{font-size:14px;color:#56665F;border:1px solid #D5DED8;border-radius:99px;padding:6px 14px;margin-bottom:12px;background:#fff}
.av-k{color:#56665F;font-size:14px}
.agentv h1{font-size:25px;margin:2px 0 4px;font-family:inherit}
.av-n{font-weight:700;margin:18px 0 -4px}
.av-hero{background:#0E5A43;color:#fff;border-radius:20px;padding:16px;margin-top:12px}
.av-hero span{font-size:13px;opacity:.85;display:block}
.av-hero b{font-size:32px;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.av-hero small{display:block;margin-top:6px;font-size:13px;opacity:.85}
.av-st{background:#fff;border:1px solid #D5DED8;border-radius:16px;padding:12px 14px;margin-top:10px}
.av-st.acc{border-left:5px solid #2F5E8C}.av-st.pay{border-left:5px solid #F2B134}
.av-st .d{font-weight:700;font-size:15px}
.av-st .t{font-size:14px;color:#56665F;margin-top:3px;line-height:1.5}
.av-st .cap{font-size:12px;color:#56665F;margin-top:4px}
.av-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.av-g div{background:#E9EFEB;border-radius:12px;padding:9px}
.av-g span{font-size:12px;color:#56665F;display:block}
.av-g b{font-size:18px;font-variant-numeric:tabular-nums}
.av-g .me{background:#FDF0D3}.av-g .me b{color:#7A5000}
.av-g .w{grid-column:1/3}
.lock.rg{background:#F4F2EC;padding:0}
.lock.rg svg{width:100%;max-width:460px;display:block;-webkit-tap-highlight-color:transparent}
.lock.rg .hit{fill:transparent;cursor:default}
.lock.rg .sp-t{font-family:Arial,sans-serif;font-weight:700;font-size:30px;color:#13251E;letter-spacing:.5px}
.lock.rg .sp-s{font-family:Arial,sans-serif;font-size:15px;color:#56665F;margin-top:6px}
.lock.rg .sp-l{font-family:Arial,sans-serif;font-size:13px;color:#56665F;margin-top:26px;display:flex;align-items:center;gap:8px}
.lock.rg .sp-l i{width:8px;height:8px;border-radius:50%;background:#C23B2A;animation:sp 1.4s infinite}
@keyframes sp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.lock.rg .sp-l i{animation:none}}

/* leads */
.lead{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none;color:var(--on-dark)}
.score.g{background:var(--jade)} .score.y{background:var(--gold);color:var(--ink)} .score.r{background:var(--red)} .score.n{background:var(--line);color:var(--muted);font-size:13px}
.lead .t{flex:1;min-width:0}
.lead .t b{display:block}
.lead .t span{font-size:13px;color:var(--muted)}
.lead .r{text-align:left}
.lead .r b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--bg);border-radius:99px;margin-top:6px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold)}
.hero{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.ring{width:110px;height:110px;max-width:100%}
.hero .lv{font-family:var(--display);font-size:20px}
.hero p{font-size:14px;color:var(--muted);line-height:1.45;margin-top:4px}
.bars{display:grid;gap:10px}
.bar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .h span{color:var(--muted)}
.bar .tr{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .tr b{display:block;height:100%;border-radius:99px}
.gate{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px;margin-bottom:12px;font-size:15px;line-height:1.45}
.gate.r{background:var(--red-soft);color:var(--red)} .gate.g{background:var(--jade-soft);color:var(--jade)}
.why{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.45}
.why:last-child{border:0}
.why .pt{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-size:15px;min-width:40px;text-align:center;border-radius:8px;padding:1px 0;height:fit-content}
.pt.m{background:var(--red-soft);color:var(--red)} .pt.p{background:var(--jade-soft);color:var(--jade)} .pt.z{background:var(--bg);color:var(--muted)}
.why span{color:var(--muted);display:block}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:6px 3px;border-bottom:1px solid var(--line)}
.cmp td{padding:8px 3px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.cmp tr:last-child td{border:0}
.cmp td.gap{color:var(--red);font-weight:700}
details.qa{border-bottom:1px solid var(--line)}
details.qa:last-child{border:0}
details.qa summary{padding:11px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";color:var(--muted)}
details.qa[open] summary::after{content:"−"}
.qa .in{padding:0 0 12px;display:grid;gap:6px;font-size:14px}
.qa .in span{color:var(--muted)}
.docrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.docrow:last-child{border:0}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.chk label.base{background:var(--jade-soft);border-color:var(--jade-soft);color:var(--jade)}
.chk input{width:auto}
.ltools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ltools button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;line-height:1.25;text-align:center;color:var(--jade);min-height:52px}
.ref .rq{padding:9px 0;border-bottom:1px solid var(--line)} .ref .rq:last-child{border-bottom:0}
.ref .rq b{display:block;font-size:16px;line-height:1.4}
.ref .rq span{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
.mup{display:inline-block;background:rgba(242,177,52,.2);color:var(--gold);border-radius:99px;padding:2px 10px;font-weight:700;font-size:14px;margin-top:6px}
.msub{color:var(--muted);font-size:14px;line-height:1.45;margin:-4px 2px 10px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.chart{display:block;width:100%;height:auto}
.sim label{font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sim label b{color:var(--jade);font-family:var(--display);font-weight:400;font-size:20px}
.sim input[type=range]{width:100%;accent-color:var(--jade);height:30px}
.mbar{display:flex;align-items:center;gap:10px;width:100%;padding:7px 0}
.mbar .mb-n{width:70px;font-weight:700;font-size:15px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar .mb-tr{flex:1;height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.mbar .mb-tr b{display:block;height:100%;border-radius:99px;background:var(--jade)}
.mbar.hot .mb-tr b{background:var(--gold)}
.mbar .mb-pc{width:40px;text-align:left;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sendrow{display:flex;gap:10px}
.send{flex:1;min-width:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none}
.send svg{width:30px;height:30px;margin-bottom:6px}
.send b{font-family:var(--display);font-weight:400;font-size:20px}
.send span{font-size:13px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send.wa{background:#1F8F55;color:#fff}
.send.ml{background:var(--blue);color:#fff}
.sentq{background:var(--gold-soft);border-radius:14px;padding:12px;margin-top:10px}
.sentq b{display:block;margin-bottom:8px;color:var(--gold-ink)}
.msgbox{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:10px;word-break:break-word;direction:ltr;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;font-size:15px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<body>

<div class="wrap">
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button data-t="gate" onclick="go('gate')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>בית</button>
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>תיקים</button>
  <button data-t="leads" onclick="go('leads')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg>לקוחות</button>
  <button data-t="more" onclick="go('more')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>עוד</button>
</nav>

<div class="veil" id="veil" hidden onclick="closeSheet()"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="lock" id="lock" hidden></div>
<div class="agentv" id="agentv" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
/* ================= storage (own keys only) ================= */
var KEY='yd2.data', PINKEY='yd2.bio', UNLOCK='yd2.unlocked';
var D=null;
function blank(){return {v:1,rev:0,updated:null,people:[],loans:[]}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(){try{D=JSON.parse(lsGet(KEY)||'null')}catch(e){D=null} if(!D||!Array.isArray(D.people))D=blank()}
function save(silent){D.rev=(D.rev||0)+1;D.updated=new Date().toISOString();lsSet(KEY,JSON.stringify(D));cloudQueue();if(!silent)render()}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}

/* ================= helpers ================= */
var HM=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function mk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addM(m,n){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+String(mo+1).padStart(2,'0')}
function mName(m){return HM[+m.slice(5,7)-1]+' '+m.slice(0,4)}
function money(n){return '฿'+Math.round(n||0).toLocaleString('en-US')}
function pct(n){return (Math.round((+n||0)*100)/100)+'%'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){v=String(v==null?'':v).replace(/[,\s฿]/g,'');var n=parseFloat(v);return isFinite(n)?n:NaN}
function $(id){return document.getElementById(id)}
function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2200)}
function person(id){return D.people.find(function(p){return p.id===id})}
function loansOf(pid){return D.loans.filter(function(l){return l.personId===pid&&!l.closed})}
function letter(s){s=String(s||'').replace(/^Sochen\s*/i,'');return s.charAt(0)||'?'}
var NOW=mk();

/* ================= engine =================
   Each loan: principal at start month, periods [{from,mode:'pay'|'acc',rate,share}], payments [{id,date,month,kind:'fee'|'principal',amount,note}].
   Month by month: fee = principal x rate. acc: whole fee added to principal. pay: fee split, agent keeps share, the rest is due to Eldad.
   Principal payments lower the principal at the end of their month. */
function periodAt(l,m){var p=null;(l.periods||[]).slice().sort(function(a,b){return a.from<b.from?-1:1}).forEach(function(x){if(x.from<=m)p=x});return p||(l.periods||[])[0]}
function calcLoan(l){
  var p=+l.principal||0,rows=[],m=l.start,guard=0,arrears=0;
  while(m<=NOW&&guard<240){
    var per=periodAt(l,m),fee=p*(+per.rate||0)/100,ag=per.mode==='pay'?fee*(+per.share||0)/100:0,me=per.mode==='pay'?fee-ag:0;
    var recv=0,prin=0,wv=0;(l.payments||[]).forEach(function(x){if(x.month===m){if(x.kind==='fee')recv+=+x.amount;else if(x.kind==='waive'||x.kind==='todebt')wv+=+x.amount;else prin+=+x.amount}});
    rows.push({m:m,p:p,fee:fee,mode:per.mode,me:me,ag:ag,recv:recv,wv:wv,prin:prin,rate:per.rate,share:per.share});
    if(m<NOW&&per.mode==='pay')arrears+=Math.max(0,me-recv-wv);
    if(m<NOW){ if(per.mode==='acc')p+=fee; p=Math.max(0,p-prin); }
    m=addM(m,1);guard++;
  }
  var cur=rows[rows.length-1]||{p:p,fee:0,me:0,ag:0,recv:0,wv:0,prin:0,mode:'pay'};
  return {rows:rows,principal:Math.max(0,cur.p-cur.prin),cur:cur,arrears:arrears,per:periodAt(l,NOW)};
}
function personStats(pid){
  var t={principal:0,fee:0,me:0,ag:0,recv:0,wv:0,arrears:0,acc:0,n:0};
  loansOf(pid).forEach(function(l){var c=calcLoan(l);t.n++;t.principal+=c.principal;t.fee+=c.cur.fee;t.me+=c.cur.me;t.ag+=c.cur.ag;t.recv+=c.cur.recv;t.wv+=c.cur.wv||0;t.arrears+=c.arrears;if(c.cur.mode==='acc')t.acc++});
  return t;
}
/* Month series for the money screen, from..to (may run past NOW).
   Past months follow calcLoan exactly; future months assume the plan in the periods and no principal repayments. */
function moneySeries(from,to){
  var out={},m=from;while(m<=to){out[m]={p:0,me:0,ag:0,recv:0};m=addM(m,1)}
  D.loans.forEach(function(l){
    var end=l.closed?mk(new Date(l.closed)):null,p=+l.principal||0,m=l.start,g=0;
    while(m<=to&&g<400){
      if(end&&m>end)break;
      var per=periodAt(l,m),fee=p*(+per.rate||0)/100,ag=per.mode==='pay'?fee*(+per.share||0)/100:0,me=per.mode==='pay'?fee-ag:0,recv=0,prin=0;
      (l.payments||[]).forEach(function(x){if(x.month===m){if(x.kind==='fee')recv+=+x.amount;else if(x.kind==='principal')prin+=+x.amount}});
      if(out[m]){out[m].p+=p;out[m].me+=me;out[m].ag+=ag;out[m].recv+=recv}
      if(per.mode==='acc')p+=fee;
      p=Math.max(0,p-prin);
      m=addM(m,1);g++;
    }
  });
  return out;
}
function statusTag(t){
  if(t.n===0)return '<span class="tag n">אין הלוואות פעילות</span>';
  if(t.arrears>0.5)return '<span class="tag late">חוב '+money(t.arrears)+'</span>';
  if(t.acc===t.n)return '<span class="tag acc">בצבירה</span>';
  if(t.me>0&&t.recv+t.wv>=t.me-0.5)return '<span class="tag ok">שולם החודש</span>';
  return '<span class="tag due">לתשלום החודש</span>';
}

/* ================= router ================= */
var route={v:'gate',id:null};
function go(v,id){route={v:v,id:id||null};var h='#'+v+(id?'-'+id:'');if(location.hash!==h){try{history.pushState(null,'',h)}catch(e){location.hash=h}}render();window.scrollTo(0,0)}
function readHash(){var h=(location.hash||'').slice(1);if(h.indexOf('p-')===0)route={v:'p',id:h.slice(2)};else if(h.indexOf('lead-')===0)route={v:'lead',id:h.slice(5)};else if(h==='more'||h==='leads'||h==='home'||h==='money'||h==='mgr')route={v:h,id:null};else route={v:'gate',id:null}}
window.addEventListener('popstate',function(){readHash();render()});

var BACK_GATE='<button class="back" onclick="go(\'gate\')">→ חזרה</button>';
function render(){
  NOW=mk();
  document.querySelector('.tabs').hidden=route.v==='gate'||route.v==='mgr';
  document.querySelectorAll('.tabs [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===route.v||(route.v==='p'&&b.dataset.t==='home')||(route.v==='lead'&&b.dataset.t==='leads'))});
  if(route.v==='p'&&person(route.id))return renderPerson(route.id);
  if(route.v==='leads')return renderLeads();
  if(route.v==='lead')return renderLead(route.id);
  if(route.v==='more')return renderMore();
  if(route.v==='home')return renderHome();
  if(route.v==='money')return renderMoney();
  if(route.v==='mgr')return renderMgr();
  renderGate();
}
function renderGate(){
  var d=new Date(),hr=d.getHours(),hi=hr<5?'לילה טוב':hr<12?'בוקר טוב':hr<17?'צהריים טובים':hr<21?'ערב טוב':'לילה טוב';
  var day=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  var pend=LD.loaded?LD.apps.filter(function(a){return a.submitted_at&&!a.decision}).length:0;
  var seal='<svg class="gt-seal" viewBox="-100 -100 200 200" fill="none" stroke="currentColor" stroke-width=".6">';
  for(var i=0;i<36;i++)seal+='<ellipse rx="92" ry="34" transform="rotate('+(i*5)+')"/>';
  seal+='<circle r="96" stroke-width="1.2"/><circle r="99"/></svg>';
  var h='<div class="gt"><div class="gt-bar"><small>'+esc(day)+'</small>'+
    '<button class="gt-set" onclick="go(\'more\')" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>'+
    '<div class="gt-head">'+seal+'<div class="gt-name">ידידים</div><div class="gt-hi">'+hi+', אלדד</div></div><div class="gt-btns">'+
    '<button class="gt-b b1" onclick="go(\'mgr\')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span class="tx"><b>מנהל</b><span>תיקי סוכנים והכסף שלי</span></span><span class="go">‹</span></button>'+
    '<button class="gt-b b2" onclick="go(\'leads\')">'+(pend?'<span class="gt-pend">'+(pend===1?'1 ממתין':pend+' ממתינים')+'</span>':'')+'<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.6 5.2"/></svg></span><span class="tx"><b>לקוחות פוטנציאליים</b><span>שאלונים, מסמכים וציון סיכון</span></span><span class="go">‹</span></button></div></div>';
  $('view').innerHTML=h;
  if(!LD.loaded&&cloud.user&&!renderGate.busy){renderGate.busy=true;leadsLoad().then(function(){renderGate.busy=false;if(route.v==='gate')renderGate()})}
}
/* Manager: same look as the gate, two doors: agents' files and the money screen. */
function renderMgr(){
  $('view').innerHTML='<div class="gt"><div class="gt-bar"><button class="gt-back" onclick="go(\'gate\')">→ חזרה</button></div>'+
    '<div class="gt-head" style="padding:18px 0 26px"><div class="gt-name" style="font-size:52px">מנהל</div><div class="gt-hi">'+esc(mName(NOW))+'</div></div><div class="gt-btns">'+
    '<button class="gt-b b1" onclick="go(\'home\')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></span><span class="tx"><b>תיקי סוכנים</b><span>הלוואות, תשלומים והסדרים</span></span><span class="go">‹</span></button>'+
    '<button class="gt-b b2" onclick="go(\'money\')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span class="tx"><b>הכסף שלי</b><span>גרפים, תחזית ומחשבון מינוף</span></span><span class="go">‹</span></button></div></div>';
}
function syncBadge(){
  if(cloud.state==='ok')return '<span class="sync ok">נשמר בענן</span>';
  if(cloud.state==='err')return '<span class="sync err">שגיאת ענן</span>';
  if(cloud.state==='busy')return '<span class="sync local">שומר…</span>';
  return '<span class="sync local" onclick="go(\'more\')">רק בטלפון</span>';
}

/* ================= home ================= */
/* ---- "הכסף שלי": fund, income by month (6 back, 6 ahead), reinvest calculator, spread across people ---- */
var SM=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
function renderMoney(){
  var from=addM(NOW,-6),to=addM(NOW,6),S=moneySeries(from,to),ms=Object.keys(S).sort();
  var list=D.people.map(function(p){return {p:p,t:personStats(p.id)}}).filter(function(x){return x.t.n>0});
  var P=0,ME=0;list.forEach(function(x){P+=x.t.principal;ME+=x.t.me});
  var p0=S[from].p,grow=P-p0,R=P?ME/P:0;

function simRun(){

  $('simF').textContent=money(f);$('simI').textContent=money(f*R);$('simK').textContent=money(pocket);$('simZ').textContent=money(F0*R*m)+' לכיס';
  var W=340,H=104,mx=pts[pts.length-1]*1.06||1,y0=H-F0/mx*H;

/* ================= agent view: a clean Thai screen with only this person's loans; closing it locks the app ================= */
var TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thM(m){return TM[+m.slice(5,7)-1]+' '+(+m.slice(0,4)+543)}
function thEnd(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(y,mo,0).getDate()+' '+thM(m)}
// principal at the start of each month, past months exactly as calcLoan, future months by the periods with no repayments
function loanPath(l,to){
  var p=+l.principal||0,m=l.start,g=0,out={};
  while(m<=to&&g<400){
    var per=periodAt(l,m),fee=p*(+per.rate||0)/100,prin=0;
    (l.payments||[]).forEach(function(x){if(x.month===m&&x.kind==='principal')prin+=+x.amount});
    out[m]={p:p,mode:per.mode,rate:+per.rate||0,share:+per.share||0,fee:fee};
    if(per.mode==='acc')p+=fee;p=Math.max(0,p-prin);m=addM(m,1);g++;
  }
  return out;
}
function showAgent(pid){
  var p=person(pid),ls=loansOf(pid),h='<button class="av-x" onclick="closeAgent()">✕ ปิด</button>'+(/[֐-׿]/.test(p.name)?'<h1>แผนเงินกู้ของคุณ</h1>':'<div class="av-k">แผนเงินกู้ของคุณ</div><h1>คุณ '+esc(p.name)+'</h1>');

/* temporary arrangement: unpaid fee split into interest-free debt + waiver, lower fee for N months, then back */
function feeLoans(pid){return loansOf(pid).filter(function(l){return !l.free&&calcLoan(l).per.mode==='pay'})}
function openTemp(pid){

    '<div class="two"><div class="fl"><label for="tMon">עמלה שלא שולמה, על חודש</label><select id="tMon" onchange="tempPrev(\''+pid+'\')">'+monthOptions(NOW,addM(NOW,-6),7)+'</select></div><div class="fl"><label for="tDue">כמה לא שולם (฿)</label><input id="tDue" inputmode="decimal" value="'+Math.round(due)+'" oninput="tempPrev(\''+pid+'\')"></div></div>'+

    '<div class="two"><div class="fl"><label for="tFee">עמלה חדשה לחודש (฿)</label><input id="tFee" inputmode="decimal" value="" oninput="tempPrev(\''+pid+'\')"></div><div class="fl"><label for="tN">לכמה חודשים</label><input id="tN" inputmode="numeric" value="4" oninput="tempPrev(\''+pid+'\')"></div></div>'+
    '<div class="fl"><label for="tFrom">העמלה החדשה מחודש</label><select id="tFrom" onchange="tempPrev(\''+pid+'\')">'+monthOptions(addM(NOW,1),addM(NOW,-1),13)+'</select></div>'+

function tempCalc(pid){
  var ls=feeLoans(pid),base=0;ls.forEach(function(l){base+=calcLoan(l).principal});
  var due=num($('tDue').value)||0,debt=num($('tDebt').value)||0,fee=num($('tFee').value),n=parseInt($('tN').value,10),from=$('tFrom').value;
  return {ls:ls,base:base,due:due,debt:debt,waive:Math.max(0,due-debt),fee:fee,n:n,from:from,end:n>0?addM(from,n):from,mon:$('tMon').value,rate:base>0&&fee>=0?fee/base*100:NaN};
}
function tempPrev(pid){var x=tempCalc(pid),p=person(pid);
  $('tWaive').value=money(x.waive);
  if(!(x.fee>=0)||!(x.n>0)){$('fPrev').textContent='הזן עמלה חדשה ומספר חודשים.';return}
  $('fPrev').textContent='על '+mName(x.mon)+': '+money(x.debt)+' עוברים לחוב בלי עמלה (הקופה גדלה בסכום הזה), '+money(x.waive)+' ויתור, והחודש נסגר כמוסדר. מ'+mName(x.from)+' עד סוף '+mName(addM(x.end,-1))+': עמלה '+money(x.fee)+' לחודש, כלומר '+pct(x.rate)+' מקרן של '+money(x.base)+', כולה אליך. מ'+mName(x.end)+' חוזרים התנאים הנוכחיים.'}
function saveTemp(pid){var x=tempCalc(pid),p=person(pid);
  if(!(x.due>0)||x.debt<0||x.debt>x.due){$('fErr').textContent='בדוק את הסכום שלא שולם ואת החוב בלי עמלה.';return}
  if(!(x.fee>=0)||!(x.n>0)||!(x.rate>=0)){$('fErr').textContent='הזן עמלה חדשה ומספר חודשים.';return}
  var id=uid(),snap={};x.ls.forEach(function(l){snap[l.id]={periods:JSON.parse(JSON.stringify(l.periods||[])),payments:JSON.parse(JSON.stringify(l.payments||[]))}});
  // settle the unpaid month across loans by their share of that month
  var parts=x.ls.map(function(l){var r=calcLoan(l).rows.find(function(r){return r.m===x.mon});return r?Math.max(0,r.me-r.recv-(r.wv||0)):0}),tot=parts.reduce(function(a,b){return a+b},0)||1;
  var today=new Date().toISOString().slice(0,10),leftD=x.debt,leftW=x.waive;
  x.ls.forEach(function(l,i){var last=i===x.ls.length-1,d=last?leftD:Math.round(x.debt*parts[i]/tot),w=last?leftW:Math.round(x.waive*parts[i]/tot);leftD-=d;leftW-=w;
    l.payments=l.payments||[];
    if(d>0)l.payments.push({id:uid(),date:today,month:x.mon,kind:'todebt',amount:d,note:'הסדר זמני'});
    if(w>0)l.payments.push({id:uid(),date:today,month:x.mon,kind:'waive',amount:w,note:'הסדר זמני'});
    var ret=JSON.parse(JSON.stringify(periodAt(l,x.end)));delete ret.temp;ret.from=x.end;
    l.periods=(l.periods||[]).filter(function(q){return q.from<x.from||q.from>x.end});
    l.periods.push({from:x.from,mode:'pay',rate:Math.round(x.rate*10000)/10000,share:0});l.periods.push(ret);
    l.periods.sort(function(a,b){return a.from<b.from?-1:1});
  });
  var debtId=null;
  if(x.debt>0){debtId=uid();D.loans.push({id:debtId,personId:pid,principal:x.debt,start:x.mon,term:null,clientRef:'',free:true,note:'עמלה שלא שולמה על '+mName(x.mon)+', עברה לחוב',periods:[{from:x.mon,mode:'pay',rate:0,share:0}],payments:[]})}
  D.temps=D.temps||[];
  D.temps.push({id:id,pid:pid,created:today,end:x.end,debtId:debtId,snap:snap,
    text:'עמלה של '+money(x.due)+' על '+mName(x.mon)+' לא שולמה: '+money(x.debt)+' עברו לחוב בלי עמלה, '+money(x.waive)+' ויתור. מ'+mName(x.from)+' עד סוף '+mName(addM(x.end,-1))+' משלם '+money(x.fee)+' לחודש ('+pct(x.rate)+'). מ'+mName(x.end)+' חוזר לתנאים הקודמים.'});
  closeSheet();save(true);toast('ההסדר הזמני נשמר');render()}
function askUndoTemp(id){openSheet('<h2>לבטל את ההסדר הזמני?</h2><div class="sub">האחוזים והתשלומים יחזרו בדיוק למה שהיה לפני ההסדר, והחוב בלי עמלה יימחק. תשלומים שנרשמו אחרי ההסדר יישמרו.</div><div class="acts"><button class="btn danger" id="okDel">כן, לבטל</button><button class="btn sec2" onclick="closeSheet()">ביטול</button></div>');

var FINGER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v3a7 7 0 0 1-1.5 4.3"/><path d="M8.5 8.6A4 4 0 0 1 16 11v2.5"/><path d="M5.5 15.5A10 10 0 0 0 6 11a6 6 0 0 1 9-5.2"/><path d="M18 9.5c.3.5.5 1 .6 1.5.2 1.9 0 3.8-.6 5.6"/><path d="M15.5 17.5a11 11 0 0 1-1.3 3"/></svg>';
function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function bioOK(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}
function bioId(){return lsGet(PINKEY)}
async function bioRegister(){
  if(!bioOK()){toast('הדפדפן הזה לא תומך בטביעת אצבע');return}
  try{
    var cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ידידים',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'yedidim',displayName:'ידידים'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    lsSet(PINKEY,b64u(cred.rawId));try{sessionStorage.setItem(UNLOCK,'1')}catch(e){}toast('טביעת האצבע הופעלה');render();
  }catch(e){toast('ההפעלה בוטלה או נכשלה')}
}
async function bioUnlock(){
  var id=bioId();if(!id)return;var msg=document.querySelector('#lock .msg');if(msg)msg.textContent='';
  try{
    var ok=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:fromB64u(id)}],userVerification:'required',timeout:60000}});
    if(ok){try{sessionStorage.setItem(UNLOCK,'1')}catch(e){}$('lock').hidden=true}
  }catch(e){if(msg)msg.textContent='לא זוהה. גע שוב בכפתור.'}
}
// decoy: only a picture of 5 rings; tapping ring centers 2 → 3 → 4 (within 5s) opens the fingerprint
var RING_SEQ=[2,3,4],ringStep=0,ringT=0;
function drawRings(){
  var L=$('lock');L.classList.add('rg');
  var C=[[70,80,'#2F5E8C'],[170,80,'#13251E'],[270,80,'#C23B2A'],[120,128,'#F2B134'],[220,128,'#0E5A43']],g='',h='';
  C.forEach(function(c,i){g+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="44" stroke="'+c[2]+'"/>';h+='<circle class="hit" cx="'+c[0]+'" cy="'+(i>2?c[1]+6:c[1])+'" r="22" onclick="ringTap('+(i+1)+')"/>'});
  L.innerHTML='<div class="sp-t" dir="ltr">Rings Sport</div><div class="sp-s" dir="ltr">Live scores, fixtures and results</div>'+
    '<svg viewBox="0 0 340 210" role="img" aria-label="Rings"><g fill="none" stroke-width="9">'+g+'</g>'+h+'</svg>'+
    '<div class="sp-l" dir="ltr"><i></i>Updating today\'s matches…</div>';
}
function ringTap(i){
  clearTimeout(ringT);ringT=setTimeout(function(){ringStep=0},5000);
  if(i===RING_SEQ[ringStep])ringStep++;else ringStep=(i===RING_SEQ[0])?1:0;
  if(ringStep===RING_SEQ.length){ringStep=0;clearTimeout(ringT);drawLock();bioUnlock()}
}

}

/* score: 40 reliability, 35 repayment, 25 stability; guarantor rule decides first */
function scoreOf(inv,app){
  var A=(app&&app.answers)||{},S=(app&&app.signals)||{},R=(app&&app.review)||{},K=inv.talk||{},why=[];
  var rel=0,rep=0,sta=0,partial=false;
  // talk vs questionnaire
  var gaps=0,cmp=0;
  [['income','הכנסה'],['debts','חובות בחודש'],['amount','סכום']].forEach(function(f){var a=nz(K[f[0]]),b=nz(A[f[0]]);if(a==null||b==null)return;cmp++;if(gapPct(a,b)>=10){gaps++;why.push(['m',0,f[1]+': בשיחה '+money(a)+', בשאלון '+money(b),'פער של '+Math.round(gapPct(a,b))+'%'])}});
  function yr(v){var y=nz(v);return y!=null&&y>2400?y-543:y}
  if(nz(K.months)!=null&&nz(A.months)!=null){cmp++;if(nz(K.months)!==nz(A.months)){gaps++;why.push(['m',0,'חודשים: בשיחה '+K.months+', בשאלון '+A.months,''])}}
  if(K.purpose&&A.purpose){cmp++;if(K.purpose!==A.purpose){gaps++;why.push(['m',0,'מטרה: בשיחה "'+HE.purpose[K.purpose]+'", בשאלון "'+HE.purpose[A.purpose]+'"',''])}}
  if(nz(K.payDay)!=null&&nz(A.payDay)!=null){cmp++;if(Math.abs(nz(K.payDay)-nz(A.payDay))>2){gaps++;why.push(['m',0,'יום משכורת: בשיחה '+K.payDay+', בשאלון '+A.payDay,''])}}
  if(yr(K.startYear)!=null&&yr(A.startYear)!=null){cmp++;if(yr(K.startYear)!==yr(A.startYear)){gaps++;why.push(['m',0,'שנת התחלה: בשיחה '+K.startYear+', בשאלון '+A.startYear,''])}}
  if(K.privateLoan==='yes'||K.privateLoan==='no'){if(A.privateLoan){cmp++;if(K.privateLoan!==A.privateLoan){gaps++;why.push(['m',0,'הלוואה פרטית: בשיחה "'+HE.yn[K.privateLoan]+'", בשאלון "'+HE.yn[A.privateLoan]+'"',''])}}}
  if(K.guarantor&&A.guarantor){cmp++;if(K.guarantor!==A.guarantor){gaps++;why.push(['m',0,'ערב: בשיחה "'+HE.guarantor[K.guarantor]+'", בשאלון "'+HE.guarantor[A.guarantor]+'"',''])}}
  var p1=!cmp?0:(gaps===0?12:(gaps===1?6:0));rel+=p1;
  if(!cmp){partial=true;why.push(['z',0,'אין סיכום שיחה להשוואה','השיחה מול השאלון לא נבדקה'])}else why.push([p1>=12?'p':'m',p1,'השיחה מול השאלון',gaps?gaps+(gaps===1?' פער':' פערים'):'הכול תואם']);
  // questionnaire vs bank
  var inc=nz(A.income),bank=nz(R.bankIncome);
  if(bank==null){partial=true;why.push(['z',0,'השאלון מול הבנק','עוד לא הקלדת הכנסה מדפי הבנק'])}
  else{var g=gapPct(inc,bank),p2=g<10?12:(g<=30?6:0);rel+=p2;why.push([p2>=12?'p':'m',p2,'הכנסה: בשאלון '+money(inc)+', בבנק '+money(bank),'פער של '+Math.round(g)+'%'])}
  // control question
  var wk=nz(A.weekly);
  if(wk!=null&&inc!=null){var g3=gapPct(inc,wk*4.3),p3=g3<10?12:(g3<=30?6:0);rel+=p3;why.push([p3>=12?'p':'m',p3,'שאלת הביקורת','בחודש '+money(inc)+', בשבוע '+money(wk)+' שזה כ-'+money(wk*4.3)+' בחודש'])}
  // salary day
  var pd=nz(A.payDay),bpd=nz(R.bankPayDay);
  if(A.source&&A.source!=='salary'){rel+=4;why.push(['p',4,'יום משכורת','לא נשאל, אין לו משכורת ('+HE.source[A.source]+')'])}
  else if(bpd==null){partial=true;why.push(['z',0,'יום המשכורת מול הבנק','עוד לא הקלדת יום משכורת מהבנק'])}
  else{var ok=pd!=null&&Math.abs(pd-bpd)<=2;rel+=ok?4:0;why.push([ok?'p':'m',ok?4:0,'יום משכורת: בשאלון '+(pd||'—')+', בבנק '+bpd,''])}
  // quiet signals
  if(S.seconds&&S.seconds<90){rel-=2;why.push(['m',-2,'מילא מהר מאוד',Math.round(S.seconds)+' שניות'])}
  if((S.incomeChanges||0)>1){rel-=2;why.push(['m',-2,'שינה את תשובת ההכנסה '+S.incomeChanges+' פעמים',''])}
  rel=Math.max(0,Math.min(40,rel));
  // repayment
  var amt=nz(A.amount),mo=nz(A.months)||12,rate=nz(R.rate);if(rate==null)rate=20;
  var pay=amt!=null?amt*rate/100+amt/mo:null,debt=(nz(A.debts)||0)+(A.privateLoan==='yes'?(nz(A.privateAmt)||0):0),base=bank!=null?bank:inc;
  if(pay!=null&&base){var ratio=(pay+debt)/base*100;rep=ratio<=30?35:ratio<=40?25:ratio<=50?15:ratio<=60?8:0;why.push([rep>=25?'p':'m',rep,'ההחזרים לוקחים '+Math.round(ratio)+'% מההכנסה',money(pay)+' בחודש להלוואה ('+rate+'% + קרן), ועוד '+money(debt)+' חובות, מתוך '+money(base)])}
  if(A.privateLoan==='yes'){rep=Math.max(0,rep-5);why.push(['m',-5,'יש הלוואה פרטית או מקבוצה',''])}
  // stability
  var y=nz(A.startYear);if(y!=null&&y>2400)y-=543;var yrs=y!=null?new Date().getFullYear()-y:null;
  if(yrs!=null){var p6=yrs>=3?10:yrs>=1?7:2;sta+=p6;why.push([p6>=7?'p':'m',p6,'ותק: מ-'+y,yrs+' שנים'])}
  var s1={save:6,cut:5,ask:2,unsure:0}[A.scen1],s2={notify:9,delay:6,wait:0}[A.scen2];
  if(s1!=null){sta+=s1;why.push([s1>=5?'p':'m',s1,'הכנסה יורדת: '+(HE.scen1[A.scen1]||''),''])}
  if(s2!=null){sta+=s2;why.push([s2>=6?'p':'m',s2,'חודש בלי לשלם: '+(HE.scen2[A.scen2]||''),''])}
  // guarantor rule
  var gate=A.guarantor==='biz'?!!(A.g1||'').trim():A.guarantor==='two'?!!((A.g1||'').trim()&&(A.g2||'').trim()):false;
  var total=Math.round(rel+rep+sta),lv=!gate?'r':total>=80?'g':total>=60?'y':'r';
  return {rel:rel,rep:rep,sta:sta,total:total,gate:gate,lv:lv,partial:partial,why:why,pay:pay};
}

     '<div class="two"><div class="fl"><label for="r_rate">אחוז לחודש לחישוב ההחזר</label><input id="r_rate" inputmode="decimal" value="'+esc(R.rate==null?20:R.rate)+'"></div><div class="fl"><label for="r_note">הערה שלך</label><input id="r_note" value="'+esc(R.note||'')+'"></div></div>'+
     '<button class="btn dark full" onclick="saveReview(\''+app.id+'\',\''+code+'\')">עדכן ציון</button></div>';
  // why
  h+='<div class="sec">למה הציון הזה</div><div class="card">'+s.why.map(function(w){var sign=w[1]>0?'+'+w[1]:String(w[1]);return '<div class="why"><b class="pt '+w[0]+' num">'+(w[0]==='z'?'?':sign)+'</b><div>'+esc(w[2])+(w[3]?'<span>'+esc(w[3])+'</span>':'')+'</div></div>'}).join('')+'</div>';
  // three sources
  function cell(v){return v==null||v===''?'—':esc(v)}
  function row3(l,k,isNum,map){var a=K[k],b=A[k],c=k==='income'?R.bankIncome:k==='payDay'?R.bankPayDay:null;
    var fa=map&&a?map[a]:isNum&&nz(a)!=null?money(a):a,fb=map&&b?map[b]:isNum&&nz(b)!=null?money(b):b,fc=isNum&&nz(c)!=null&&k!=='payDay'?money(c):c;
    var gab=isNum?gapPct(nz(a),nz(b)):(a&&b&&a!==b?100:0),gbc=isNum?gapPct(nz(b),nz(c)):0;
    return '<tr><td>'+l+'</td><td'+(gab>=10?' class="gap"':'')+'>'+cell(fa)+'</td><td>'+cell(fb)+'</td><td'+(gbc>=10?' class="gap"':'')+'>'+cell(fc)+'</td></tr>'}
  h+='<div class="sec">שיחה, שאלון, מסמכים</div><div class="card"><table class="cmp"><thead><tr><th>נתון</th><th>שיחה</th><th>שאלון</th><th>בנק</th></tr></thead><tbody>'+
     row3('סכום','amount',true)+row3('הכנסה','income',true)+row3('חובות','debts',true)+row3('מאיזו שנה','startYear',false)+row3('יום משכורת','payDay',false)+row3('הלוואה פרטית','privateLoan',false,HE.yn)+row3('ערב','guarantor',false,HE.guarantor)+
     '</tbody></table>'+(K.feel?'<p class="ex" style="text-align:right">התחושה שלך: '+esc(K.feel)+'</p>':'')+'</div>';
  // docs
  var F=app.files||{},req=['id','bank',A.source==='self'?'biz':'payslip'].concat((inv.docs||[]).filter(function(d){return ['id','bank','payslip','biz'].indexOf(d)<0})).concat((A.loans||[]).map(function(l,i){return 'loan'+(i+1)}));
  h+='<div class="sec">מסמכים</div><div class="card">'+req.map(function(k){var fs=F[k]||[];return '<div class="docrow"><span>'+esc(docHe(k,A))+'</span>'+(fs.length?fs.map(function(p,i){return '<button class="btn sec2" style="width:auto;padding:6px 12px" onclick="openDoc(\''+p.replace(/'/g,'')+'\')">פתח'+(fs.length>1?' '+(i+1):'')+'</button>'}).join(' '):'<span class="tag late">חסר</span>')+'</div>'}).join('')+'</div>';
  h+='<div class="sec">בדיקה ממוחשבת של המסמכים</div><div class="card" id="docCheck"><div class="empty" style="padding:10px">קורא את המסמכים…</div></div>';
  // signals + answers
  var S=app.signals||{};
  h+='<div class="sec">סימנים שקטים</div><div class="card" style="font-size:14px;line-height:1.6">מילא ב-'+(S.seconds?(S.seconds<90?S.seconds+' שניות':Math.round(S.seconds/60)+' דקות'):'—')+'. שינה את תשובת ההכנסה '+(S.incomeChanges||0)+' פעמים. נשלח ב-'+new Date(app.submitted_at).toLocaleString('he-IL')+'.</div>';
  function qa(l,v){return '<div><span>'+l+'</span><br>'+cell(v)+'</div>'}
  h+='<div class="sec">תשובות השאלון</div><div class="card" style="padding-block:2px">'+
    '<details class="qa"><summary>1. הבקשה</summary><div class="in">'+qa('סכום',A.amount&&money(A.amount))+qa('חודשים',A.months)+qa('למה',HE.purpose[A.purpose])+'</div></details>'+
    '<details class="qa"><summary>2. עבודה</summary><div class="in">'+qa('מקור הכנסה',HE.source[A.source])+qa('מקום עבודה',A.employer)+qa('טלפון',A.workPhone)+qa('מאיזו שנה',A.startYear)+qa('יום משכורת',A.payDay)+'</div></details>'+
    '<details class="qa"><summary>3. כסף</summary><div class="in">'+qa('נכנס בחודש שעבר',A.income&&money(A.income))+qa('חובות בחודש',A.debts&&money(A.debts))+(A.loans?qa('מספר הלוואות',String(A.loans.length))+A.loans.map(function(l,i){return qa('הלוואה '+(i+1),loanLine(l))}).join(''):'')+qa('הלוואה פרטית',HE.yn[A.privateLoan]+(A.privateAmt?', '+money(A.privateAmt)+' בחודש':''))+'</div></details>'+
    '<details class="qa"><summary>4. אם יקרה…</summary><div class="in">'+qa('הכנסה יורדת',HE.scen1[A.scen1])+qa('חודש בלי לשלם',HE.scen2[A.scen2])+'</div></details>'+
    '<details class="qa"><summary>5. ערב</summary><div class="in">'+qa('סוג',HE.guarantor[A.guarantor])+qa('ערב 1',A.g1)+qa('ערב 2',A.g2)+'</div></details>'+
    '<details class="qa"><summary>6. שאלה אחרונה</summary><div class="in">'+qa('כמה נכנס בשבוע',A.weekly&&money(A.weekly))+'</div></details></div>';
  h+='<div class="acts"><button class="btn pri" style="grid-column:1/-1" onclick="decide(\''+app.id+'\',\''+code+'\',\'approved\')">'+(app.decision==='approved'?'✓ אושר בתנאי ערבות':'אשר בתנאי ערבות')+'</button><button class="btn sec2" onclick="decide(\''+app.id+'\',\''+code+'\',\'more\')">בקש עוד</button><button class="btn danger" onclick="decide(\''+app.id+'\',\''+code+'\',\'rejected\')">דחה</button></div>';
  if(app.decision==='approved')h+='<button class="btn dark full" style="margin-top:8px" onclick="loanFromLead(\''+code+'\')">פתח הלוואה בתיקים</button>';
  $('view').innerHTML=h;
  runDocCheck(code);
}

/* ================= free in-browser document check (text PDFs only) ================= */
var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var DOCCACHE={};
function loadPdfJs(){return new Promise(function(res,rej){if(window.pdfjsLib)return res(window.pdfjsLib);var s=document.createElement('script');s.src=PDFJS_URL;s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;res(window.pdfjsLib)};s.onerror=rej;document.head.appendChild(s)})}
async function pdfLines(path){
  var dl=await cloud.sb.storage.from('yd-docs').download(path);if(dl.error)throw new Error('download');
  var buf=new Uint8Array(await dl.data.arrayBuffer());
  if(String.fromCharCode.apply(null,buf.slice(0,5))!=='%PDF-')return {notPdf:true,lines:[]};
  var lib=await loadPdfJs(),doc=await lib.getDocument({data:buf}).promise,lines=[];
  for(var p=1;p<=Math.min(doc.numPages,30);p++){
    var tc=await (await doc.getPage(p)).getTextContent(),rows={};
    tc.items.forEach(function(it){var y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})});
    Object.keys(rows).sort(function(a,b){return b-a}).forEach(function(y){lines.push(rows[y].sort(function(a,b){return a.x-b.x}).map(function(o){return o.s}).join(' ').replace(/\s+/g,' ').trim())});
  }
  return {notPdf:false,lines:lines.filter(Boolean)};
}
var RX_DATE=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/;
var RX_AMT=/\d{1,3}(?:,\d{3})+(?:\.\d{2})|\d+\.\d{2}/g;
var RX_SAL=/salary|payroll|sal\b|payrl|เงินเดือน|ค่าจ้าง|โอนเงินเดือน|เงินเดือนเข้า/i;
function amts(line){return (line.match(RX_AMT)||[]).map(function(a){return parseFloat(a.replace(/,/g,''))}).filter(function(n){return n>0})}
function analyzeBank(lines,employer){
  var emp=(employer||'').toLowerCase().split(/\s+/).filter(function(w){return w.length>=4})[0]||null,hits=[];
  lines.forEach(function(l){var d=l.match(RX_DATE);if(!d)return;var low=l.toLowerCase();
    if(RX_SAL.test(l)||(emp&&low.indexOf(emp)>=0)){var a=amts(l);if(a.length)hits.push({day:+d[1],mon:d[2]+'/'+d[3],amt:a[0],line:l})}});
  var byMon={};hits.forEach(function(h){if(!byMon[h.mon]||h.amt>byMon[h.mon].amt)byMon[h.mon]=h});
  var ms=Object.keys(byMon).map(function(k){return byMon[k]});
  if(!ms.length)return {found:false,lineCount:lines.length};
  var avg=ms.reduce(function(s,h){return s+h.amt},0)/ms.length,days={};ms.forEach(function(h){days[h.day]=(days[h.day]||0)+1});
  var day=+Object.keys(days).sort(function(a,b){return days[b]-days[a]})[0];
  return {found:true,months:ms.length,avg:avg,day:day,sample:ms.slice(0,6)};
}
function analyzePayslip(lines,employer){
  var net=null,emp=(employer||'').toLowerCase().split(/\s+/).filter(function(w){return w.length>=4})[0]||null,empFound=false;
  var RX_NET=/net\s*pay|net\s*salary|net\s*income|เงินได้สุทธิ|รับสุทธิ|ยอดสุทธิ|เงินเดือนสุทธิ|total\s*income|รวมเงินได้/i;
  lines.forEach(function(l,i){if(emp&&l.toLowerCase().indexOf(emp)>=0)empFound=true;if(net==null&&RX_NET.test(l)){var a=amts(l);if(!a.length&&lines[i+1])a=amts(lines[i+1]);if(a.length)net=Math.max.apply(null,a)}});
  return {net:net,empFound:empFound,emp:emp,lineCount:lines.length};
}
function verdict(gap){return gap==null?'y':gap<10?'g':gap<=30?'y':'r'}
async function runDocCheck(code){
  var box=$('docCheck');if(!box)return;
  var inv=LD.inv.find(function(x){return x.code===code}),app=appOf(code);if(!app)return;
  var A=app.answers||{},F=app.files||{},inc=nz(A.income),out=[],auto=null;
  try{
    if(!DOCCACHE[code]){DOCCACHE[code]={};
      for(var k of ['bank','payslip']){var fs=F[k]||[];if(!fs.length)continue;var all=[],notPdf=false;
        for(var p of fs){try{var r=await pdfLines(p);if(r.notPdf)notPdf=true;all=all.concat(r.lines)}catch(e){notPdf=notPdf||false}}
        DOCCACHE[code][k]={lines:all,notPdf:notPdf}}}
    var C=DOCCACHE[code];
    if(C.bank){var b=C.bank;
      if(b.notPdf&&!b.lines.length)out.push(['y','דפי בנק','זה לא קובץ PDF של הבנק, ולכן אי אפשר לקרוא אותו. לבדוק ידנית.']);
      else if(!b.lines.length)out.push(['y','דפי בנק','לא נמצא טקסט בקובץ. כנראה סריקה או צילום. לבדוק ידנית.']);
      else{var ab=analyzeBank(b.lines,A.employer);
        if(!ab.found)out.push(['y','דפי בנק','נקראו '+ab.lineCount+' שורות, אבל לא זוהתה משכורת (לא נמצאה המילה "เงินเดือน" או "SALARY" או שם המעסיק). לבדוק ידנית.']);
        else{var g=gapPct(inc,ab.avg);auto={bankIncome:Math.round(ab.avg),bankPayDay:ab.day};
          out.push([verdict(g),'דפי בנק','זוהתה משכורת ב-'+ab.months+' חודשים. ממוצע '+money(ab.avg)+', בדרך כלל ב-'+ab.day+' לחודש. הלקוח כתב '+money(inc)+(g!=null?', פער של '+Math.round(g)+'%':'')+'. יום משכורת בשאלון: '+(A.payDay||'—')+'.'])}}}
    if(C.payslip){var s=C.payslip;
      if(!s.lines.length)out.push(['y','תלוש',''+(s.notPdf?'זה לא קובץ PDF':'אין טקסט בקובץ')+'. לבדוק ידנית.']);
      else{var ap=analyzePayslip(s.lines,A.employer),g2=ap.net!=null?gapPct(inc,ap.net):null;
        out.push([ap.net==null?'y':verdict(g2),'תלוש',(ap.net!=null?'שכר בתלוש '+money(ap.net)+', הלקוח כתב '+money(inc)+', פער של '+Math.round(g2)+'%.':'לא נמצא סכום שכר נטו בתלוש.')+(ap.emp?(ap.empFound?' שם המעסיק מופיע בתלוש.':' שם המעסיק "'+esc(A.employer)+'" לא נמצא בתלוש.'):'')])}}
    if(!out.length)out.push(['y','מסמכים','אין דפי בנק או תלוש לקריאה.']);
  }catch(e){out=[['y','מסמכים','הקריאה נכשלה. בדוק שיש חיבור לאינטרנט ונסה שוב.']]}
  box.innerHTML=out.map(function(o){return '<div class="why"><b class="pt '+(o[0]==='g'?'p':o[0]==='r'?'m':'z')+'">'+(o[0]==='g'?'✓':o[0]==='r'?'!':'?')+'</b><div><b>'+o[1]+'</b><span>'+o[2]+'</span></div></div>'}).join('')+
    (auto?'<p class="ex" style="text-align:right">הנתונים מהבנק נכנסו לציון באופן אוטומטי. אפשר לתקן אותם למעלה, ב"בדיקה שלך מול דפי הבנק".</p>':'')+
    '<p class="ex" style="text-align:right">הקריאה החינמית עובדת רק על קובצי PDF מקוריים מהבנק או מהמעסיק.</p>';
  // fill bank fields automatically if empty
  if(auto&&app.review&&(app.review.bankIncome==null||app.review.bankIncome==='')&&!app.review.autoDone){
    var R=Object.assign({},app.review,{bankIncome:String(auto.bankIncome),bankPayDay:String(auto.bankPayDay),auto:true,autoDone:true});
    var rr=await cloud.sb.rpc('yd_review',{app:app.id,rev:R,d:app.decision||null});
    if(!rr.error){app.review=R;toast('הציון עודכן לפי דפי הבנק');renderLead(code)}
  }
}
async function saveReview(id,code){var app=appOf(code),R=Object.assign({},app.review||{});
  R.bankIncome=$('r_bank').value.trim()||null;R.bankPayDay=$('r_pd').value.trim()||null;var rt=num($('r_rate').value);R.rate=isFinite(rt)?rt:20;R.note=$('r_note').value.trim();
  var r=await cloud.sb.rpc('yd_review',{app:id,rev:R,d:app.decision||null});if(r.error){toast('השמירה נכשלה');return}
  app.review=R;toast('הציון עודכן');renderLead(code)}
async function decide(id,code,d){var app=appOf(code);var r=await cloud.sb.rpc('yd_review',{app:id,rev:app.review||{},d:d});if(r.error){toast('השמירה נכשלה');return}
  app.decision=d;toast({approved:'סומן: אושר בתנאי ערבות',more:'סומן: ביקשת עוד',rejected:'סומן: נדחה'}[d]);renderLead(code)}
async function openDoc(path){var r=await cloud.sb.storage.from('yd-docs').createSignedUrl(path,300);if(r.error){toast('לא הצלחתי לפתוח');return}window.open(r.data.signedUrl,'_blank','noopener')}
function delInvite(code){openSheet('<h2>למחוק את השאלון?</h2><div class="sub">הקישור שנשלח ללקוח יפסיק לעבוד.</div><div class="acts"><button class="btn danger" id="okDel">כן, למחוק</button><button class="btn sec2" onclick="closeSheet()">ביטול</button></div>');
  $('okDel').onclick=async function(){var r=await cloud.sb.from('yd_invites').delete().eq('code',code);closeSheet();if(r.error){toast('המחיקה נכשלה');return}LD.loaded=false;go('leads')}}
function loanFromLead(code){var inv=LD.inv.find(function(x){return x.code===code}),A=(appOf(code)||{}).answers||{};
  openLoanSheet(null,null);$('fP').value='__new';$('fNewWrap').hidden=false;$('fNew').value=inv.client_name||'';$('fAmt').value=A.amount||'';if(A.months)$('fTerm').value=A.months;$('fRef').value='';$('fNote').value='מהשאלון';loanPrev()}
