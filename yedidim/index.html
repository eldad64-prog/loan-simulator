<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5A43">
<title>ידידים</title>
<!--
  Yedidim, new app. Fully separate from the old app in /v2/.
  - Own storage keys (prefix "yd2.") and own auth storage key, so it never reads or writes the old app's data.
  - Own cloud table (yd_state), locked by row level security to the signed-in owner.
  - No passwords or personal data in this file.
  Note for the old service worker at the site root: this page already handles its own cloud code,
  and the marker text "supabase-sync.js" here tells that worker not to inject the old sync script.
-->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first, one view at a time, fixed bottom bar; sheets slide up for every edit. */
:root{
  --bg:#E9EFEB; --surface:#FFFFFF; --ink:#13251E; --muted:#56665F; --line:#D5DED8;
  --jade:#0E5A43; --jade-2:#13785A; --jade-soft:#DCEDE5;
  --gold:#F2B134; --gold-soft:#FDF0D3; --gold-ink:#7A5000;
  --blue:#2F5E8C; --blue-soft:#E1EBF5; --red:#C23B2A; --red-soft:#F9E1DD;
  --on-dark:#FFFFFF; --veil:rgba(19,37,30,.45);
  --display:"Secular One","Assistant",Arial,sans-serif; --body:"Assistant",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,.num,.big,.disp{font-family:var(--display);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.top h1{font-size:26px;line-height:1.1}
.top small{color:var(--muted);font-size:14px;display:block}
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sync.ok{background:var(--jade-soft);color:var(--jade)} .sync.local{background:var(--gold-soft);color:var(--gold-ink)} .sync.err{background:var(--red-soft);color:var(--red)}
.back{color:var(--jade);font-weight:700;padding:6px 0;margin-bottom:6px;display:inline-block}

/* summary */
.sum{background:var(--jade);color:var(--on-dark);border-radius:20px;padding:16px;margin-bottom:12px}
.sum .lbl{opacity:.85;font-size:15px}
.sum .big{font-size:36px;line-height:1.15}
.sum .split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.sum .split span{display:block;font-size:12px;opacity:.85}
.sum .split b{font-size:17px}
.alert{display:flex;gap:10px;align-items:center;background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:15px}
.sec{font-family:var(--display);font-size:18px;margin:8px 2px 10px}

/* person card in list */
.pc{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.pc .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--jade);color:var(--on-dark);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.pc .hd .nm{flex:1;min-width:0}
.pc .hd b{font-size:18px;display:block}
.chev{color:var(--muted);font-size:22px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;display:inline-block;margin-left:4px}
.tag.n{background:var(--blue-soft);color:var(--blue)} .tag.acc{background:var(--blue-soft);color:var(--blue)} .tag.ok{background:var(--jade-soft);color:var(--jade)} .tag.due{background:var(--gold-soft);color:var(--gold-ink)} .tag.late{background:var(--red-soft);color:var(--red)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--bg);border-radius:12px;padding:8px}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-size:16px;font-variant-numeric:tabular-nums}
.trio.white div{background:var(--surface);border:1px solid var(--line)}

/* loan */
.loan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.loan .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.loan .lh b{font-size:24px}
.loan .lh span{font-size:13px;color:var(--muted);text-align:left}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.terms span{font-size:13px;font-weight:700;background:var(--bg);border-radius:99px;padding:3px 10px}
.terms span.acc{background:var(--blue-soft);color:var(--blue)} .terms span.pay{background:var(--jade-soft);color:var(--jade)}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.split3 div{border-radius:12px;padding:8px 4px}
.split3 span{display:block;font-size:12px;color:var(--muted)}
.split3 b{font-size:16px;font-variant-numeric:tabular-nums}
.split3 .t{background:var(--bg)} .split3 .me{background:var(--jade-soft)} .split3 .me b{color:var(--jade)} .split3 .ag{background:var(--gold-soft)} .split3 .ag b{color:var(--gold-ink)}
.plain{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5;margin-top:10px}
.cli{font-size:13px;color:var(--muted);margin-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:12px 10px;border-radius:12px;font-weight:700;text-align:center;font-size:15px}
.btn.pri{background:var(--jade);color:var(--on-dark)} .btn.sec2{background:var(--surface);border:1.5px solid var(--line)} .btn.dark{background:var(--ink);color:var(--on-dark)} .btn.danger{background:var(--red-soft);color:var(--red)}
.btn.full{display:block;width:100%}
.plan{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.plan>b{font-size:15px;display:block;margin-bottom:6px}
.step{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.step i{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--line)}
.step.acc i{background:var(--blue)} .step.pay i{background:var(--jade)}
.step b{font-size:15px}
.step span{display:block;font-size:13px;color:var(--muted)}
.step .st{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.st.now{background:var(--jade-soft);color:var(--jade)} .st.fut{background:var(--gold-soft);color:var(--gold-ink)} .st.past{background:var(--bg);color:var(--muted)}
.more-link{color:var(--jade);font-weight:700;font-size:14px;margin-top:8px;display:inline-block;padding:4px 0}

/* ledger */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ledger td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger tr:last-child td{border:0}
.ledger td.k{font-weight:700}
.pay-list .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay-list .row:last-child{border:0}
.pay-list .row span{color:var(--muted);font-size:13px;display:block}
.x{color:var(--red);font-weight:700;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:24px 10px;line-height:1.6}
.ex{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}

/* settings */
.set .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.set .row:last-child{border:0}
.set .row b{display:block}
.set .row span{display:block;font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;min-width:72px;padding:4px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--jade)}
.tabs .fab{width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--jade);margin-top:-30px;box-shadow:0 6px 16px rgba(14,90,67,.3);justify-content:center;min-width:0}
.tabs .fab svg{width:28px;height:28px}

/* sheet */
.veil{position:fixed;inset:0;background:var(--veil);z-index:20}
.sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:21}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px;line-height:1.45}
.fl{margin-bottom:12px}
.fl label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fl input,.fl select,.fl textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.fl textarea{min-height:140px;direction:ltr;font-size:13px}
.fl .hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:center;background:var(--surface)}
.opts button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.opts button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.prev{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:10px}
.err{color:var(--red);font-size:14px;font-weight:700;margin-bottom:8px}

/* lock */
.lock{position:fixed;inset:0;background:var(--jade);color:var(--on-dark);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.mark{font-family:var(--display);font-size:44px}
.mark span{color:var(--gold)}
.lock p{opacity:.9;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0 18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.dots i.f{background:var(--on-dark);border-color:var(--on-dark)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:290px}
.pad button{height:58px;border-radius:16px;background:rgba(255,255,255,.12);color:var(--on-dark);font-size:24px;font-family:var(--display);text-align:center}
.pad button:active{background:rgba(255,255,255,.25)}
.lock .msg{min-height:22px;margin-top:12px;color:var(--gold);font-weight:700}
.finger{margin:34px auto 16px;width:116px;height:116px;border-radius:50%;background:var(--gold);color:var(--jade);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(242,177,52,.18)}
.finger svg{width:58px;height:58px}
.lock .help{margin-top:22px;color:var(--on-dark);opacity:.85;text-decoration:underline;font-size:14px;padding:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;font-size:15px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>תיקים</button>
  <button class="fab" onclick="openLoanSheet()" aria-label="הלוואה חדשה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="more" onclick="go('more')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>עוד</button>
</nav>

<div class="veil" id="veil" hidden onclick="closeSheet()"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="lock" id="lock" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
/* ================= storage (own keys only) ================= */
var KEY='yd2.data', PINKEY='yd2.bio', UNLOCK='yd2.unlocked';
var D=null;
function blank(){return {v:1,rev:0,updated:null,people:[],loans:[]}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(){try{D=JSON.parse(lsGet(KEY)||'null')}catch(e){D=null} if(!D||!Array.isArray(D.people))D=blank()}
function save(silent){D.rev=(D.rev||0)+1;D.updated=new Date().toISOString();lsSet(KEY,JSON.stringify(D));cloudQueue();if(!silent)render()}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}

/* ================= helpers ================= */
var HM=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function mk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addM(m,n){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+String(mo+1).padStart(2,'0')}
function mName(m){return HM[+m.slice(5,7)-1]+' '+m.slice(0,4)}
function money(n){return '฿'+Math.round(n||0).toLocaleString('en-US')}
function pct(n){return (Math.round((+n||0)*100)/100)+'%'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){v=String(v==null?'':v).replace(/[,\s฿]/g,'');var n=parseFloat(v);return isFinite(n)?n:NaN}
function $(id){return document.getElementById(id)}
function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2200)}
function person(id){return D.people.find(function(p){return p.id===id})}
function loansOf(pid){return D.loans.filter(function(l){return l.personId===pid&&!l.closed})}
function letter(s){s=String(s||'').replace(/^Sochen\s*/i,'');return s.charAt(0)||'?'}
var NOW=mk();

/* ================= engine =================
   Each loan: principal at start month, periods [{from,mode:'pay'|'acc',rate,share}], payments [{id,date,month,kind:'fee'|'principal',amount,note}].
   Month by month: fee = principal x rate. acc: whole fee added to principal. pay: fee split, agent keeps share, the rest is due to Eldad.
   Principal payments lower the principal at the end of their month. */
function periodAt(l,m){var p=null;(l.periods||[]).slice().sort(function(a,b){return a.from<b.from?-1:1}).forEach(function(x){if(x.from<=m)p=x});return p||(l.periods||[])[0]}
function calcLoan(l){
  var p=+l.principal||0,rows=[],m=l.start,guard=0,arrears=0;
  while(m<=NOW&&guard<240){
    var per=periodAt(l,m),fee=p*(+per.rate||0)/100,ag=per.mode==='pay'?fee*(+per.share||0)/100:0,me=per.mode==='pay'?fee-ag:0;
    var recv=0,prin=0;(l.payments||[]).forEach(function(x){if(x.month===m){if(x.kind==='fee')recv+=+x.amount;else prin+=+x.amount}});
    rows.push({m:m,p:p,fee:fee,mode:per.mode,me:me,ag:ag,recv:recv,prin:prin,rate:per.rate,share:per.share});
    if(m<NOW&&per.mode==='pay')arrears+=Math.max(0,me-recv);
    if(m<NOW){ if(per.mode==='acc')p+=fee; p=Math.max(0,p-prin); }
    m=addM(m,1);guard++;
  }
  var cur=rows[rows.length-1]||{p:p,fee:0,me:0,ag:0,recv:0,prin:0,mode:'pay'};
  return {rows:rows,principal:Math.max(0,cur.p-cur.prin),cur:cur,arrears:arrears,per:periodAt(l,NOW)};
}
function personStats(pid){
  var t={principal:0,fee:0,me:0,ag:0,recv:0,arrears:0,acc:0,n:0};
  loansOf(pid).forEach(function(l){var c=calcLoan(l);t.n++;t.principal+=c.principal;t.fee+=c.cur.fee;t.me+=c.cur.me;t.ag+=c.cur.ag;t.recv+=c.cur.recv;t.arrears+=c.arrears;if(c.cur.mode==='acc')t.acc++});
  return t;
}
function statusTag(t){
  if(t.n===0)return '<span class="tag n">אין הלוואות פעילות</span>';
  if(t.arrears>0.5)return '<span class="tag late">חוב '+money(t.arrears)+'</span>';
  if(t.acc===t.n)return '<span class="tag acc">בצבירה</span>';
  if(t.me>0&&t.recv>=t.me-0.5)return '<span class="tag ok">שולם החודש</span>';
  return '<span class="tag due">לתשלום החודש</span>';
}

/* ================= router ================= */
var route={v:'home',id:null};
function go(v,id){route={v:v,id:id||null};var h='#'+v+(id?'-'+id:'');if(location.hash!==h){try{history.pushState(null,'',h)}catch(e){location.hash=h}}render();window.scrollTo(0,0)}
function readHash(){var h=(location.hash||'').slice(1);if(h.indexOf('p-')===0)route={v:'p',id:h.slice(2)};else if(h==='more')route={v:'more',id:null};else route={v:'home',id:null}}
window.addEventListener('popstate',function(){readHash();render()});

function render(){
  NOW=mk();
  document.querySelectorAll('.tabs [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===route.v||(route.v==='p'&&b.dataset.t==='home'))});
  if(route.v==='p'&&person(route.id))return renderPerson(route.id);
  if(route.v==='more')return renderMore();
  renderHome();
}
function syncBadge(){
  if(cloud.state==='ok')return '<span class="sync ok">נשמר בענן</span>';
  if(cloud.state==='err')return '<span class="sync err">שגיאת ענן</span>';
  if(cloud.state==='busy')return '<span class="sync local">שומר…</span>';
  return '<span class="sync local" onclick="go(\'more\')">רק בטלפון</span>';
}

/* ================= home ================= */
function renderHome(){
  var list=D.people.map(function(p){return {p:p,t:personStats(p.id)}}).filter(function(x){return x.t.n>0||!x.p.archived});
  list.sort(function(a,b){return b.t.arrears-a.t.arrears||b.t.principal-a.t.principal});
  var T={principal:0,fee:0,me:0,ag:0,recv:0,arrears:0,late:0};
  list.forEach(function(x){['principal','fee','me','ag','recv','arrears'].forEach(function(k){T[k]+=x.t[k]});if(x.t.arrears>0.5)T.late++});
  var h='<div class="top"><div><small>'+mName(NOW)+'</small><h1>תיקי סוכנים</h1></div>'+syncBadge()+'</div>';
  if(!D.people.length){
    h+='<div class="card empty"><b class="disp" style="font-size:20px;color:var(--ink)">עוד אין כאן תיקים</b><br>אפשר להעתיק את כל הנתונים מהאפליקציה הישנה בלחיצה, בלי לשנות בה כלום.<br><br><button class="btn pri" onclick="openImport()">העתקה מהאפליקציה הישנה</button><br><br><button class="btn sec2" onclick="openLoanSheet()">או הוספת הלוואה ראשונה</button></div>';
    $('view').innerHTML=h;return;
  }
  h+='<div class="sum"><div class="lbl">כסף בחוץ</div><div class="big num">'+money(T.principal)+'</div>'+
     '<div class="split"><div><span>עמלה החודש</span><b class="num">'+money(T.fee)+'</b></div><div><span>לך החודש</span><b class="num">'+money(T.me)+'</b></div><div><span>לסוכנים</span><b class="num">'+money(T.ag)+'</b></div></div></div>';
  h+='<div class="trio white" style="margin-bottom:12px"><div><span>התקבל החודש</span><b class="num" style="color:var(--jade)">'+money(T.recv)+'</b></div><div><span>עוד צפוי החודש</span><b class="num">'+money(Math.max(0,T.me-T.recv))+'</b></div><div><span>חוב מחודשים קודמים</span><b class="num" style="color:'+(T.arrears>0.5?'var(--red)':'var(--ink)')+'">'+money(T.arrears)+'</b></div></div>';
  if(T.late)h+='<div class="alert">⚠ '+T.late+(T.late===1?' אדם חייב':' אנשים חייבים')+' תשלום מחודשים קודמים</div>';
  h+='<div class="sec">לפי אדם</div>';
  list.forEach(function(x){var p=x.p,t=x.t;
    h+='<button class="pc" onclick="go(\'p\',\''+p.id+'\')"><div class="hd"><div class="av">'+esc(letter(p.name))+'</div><div class="nm"><b>'+esc(p.name)+'</b><span class="tag n">'+(t.n===1?'הלוואה אחת':t.n+' הלוואות')+'</span>'+statusTag(t)+'</div><span class="chev">‹</span></div>'+
       '<div class="trio"><div><span>קרן בחוץ</span><b>'+money(t.principal)+'</b></div><div><span>לך בחודש</span><b>'+money(t.me)+'</b></div><div><span>לסוכן בחודש</span><b>'+money(t.ag)+'</b></div></div></button>';
  });
  $('view').innerHTML=h;
}

/* ================= person ================= */
function plainText(l,name,c){
  var per=c.per;
  if(per.mode==='acc')return 'ל'+name+' ניתנו '+money(l.principal)+'. כרגע בצבירה: כל חודש '+pct(per.rate)+' מהקרן נוספים לקרן ולא משולמים. הקרן עכשיו '+money(c.principal)+'.';
  return 'כל חודש '+pct(per.rate)+' מהקרן, כלומר '+money(c.cur.fee)+'. '+(+per.share>0?'מזה '+pct(per.share)+' נשארים אצל '+name+', כלומר '+money(c.cur.ag)+'. אליך מגיעים '+money(c.cur.me)+'.':'כל הסכום מגיע אליך.');
}
function renderPerson(pid){
  var p=person(pid),t=personStats(pid),ls=loansOf(pid);
  var h='<button class="back" onclick="go(\'home\')">→ כל התיקים</button>';
  h+='<div class="top"><div><small>כרטיס אדם</small><h1>'+esc(p.name)+'</h1></div>'+statusTag(t)+'</div>';
  if(p.note)h+='<p class="ex" style="text-align:right;margin:-6px 0 12px">'+esc(p.note)+'</p>';
  h+='<div class="trio white" style="margin-bottom:10px"><div><span>קרן בחוץ</span><b>'+money(t.principal)+'</b></div><div><span>לך בחודש</span><b style="color:var(--jade)">'+money(t.me)+'</b></div><div><span>לסוכן בחודש</span><b style="color:var(--gold-ink)">'+money(t.ag)+'</b></div></div>';
  if(t.arrears>0.5)h+='<div class="alert">⚠ חוב מחודשים קודמים: '+money(t.arrears)+'</div>';
  h+='<div class="sec">ההלוואות</div>';
  if(!ls.length)h+='<div class="card empty">אין הלוואות פעילות.</div>';
  ls.forEach(function(l,i){
    var c=calcLoan(l),per=c.per;
    h+='<div class="loan"><div class="lh"><b class="num">'+money(c.principal)+'</b><span>הלוואה '+(i+1)+(l.clientRef?'<br>'+esc(l.clientRef):'')+'</span></div>'+
       '<div class="terms"><span class="'+per.mode+'">'+(per.mode==='acc'?'בצבירה':'תשלום כל חודש')+'</span><span>'+pct(per.rate)+' לחודש</span><span>'+pct(per.share)+' ל'+esc(p.name)+'</span>'+(l.term?'<span>'+l.term+' חודשים</span>':'')+'</div>'+
       '<div class="split3"><div class="t"><span>עמלה בחודש</span><b>'+money(c.cur.fee)+'</b></div><div class="me"><span>'+(per.mode==='acc'?'נוסף לקרן':'לך')+'</span><b>'+money(per.mode==='acc'?c.cur.fee:c.cur.me)+'</b></div><div class="ag"><span>ל'+esc(p.name)+'</span><b>'+money(c.cur.ag)+'</b></div></div>'+
       '<div class="plain">'+plainText(l,esc(p.name),c)+'</div>'+
       (l.clientRef?'<div class="cli">לקוח רשום, מידע עזר: '+esc(l.clientRef)+'</div>':'')+
       planHtml(l)+
       '<div class="acts"><button class="btn pri" onclick="openPay(\''+l.id+'\')">רשום תשלום</button><button class="btn dark" onclick="openPlan(\''+l.id+'\')">שנה הסדר</button></div>'+
       '<button class="more-link" onclick="openLoanSheet(\''+l.id+'\')">עריכת הלוואה, העברה לאדם אחר או סגירה ‹</button></div>';
  });
  // monthly table for the person
  var months={};ls.forEach(function(l){calcLoan(l).rows.forEach(function(r){var x=months[r.m]||(months[r.m]={me:0,recv:0,acc:0});x.me+=r.me;x.recv+=r.recv;if(r.mode==='acc')x.acc+=r.fee})});
  var keys=Object.keys(months).sort().reverse().slice(0,12);
  if(keys.length){
    h+='<div class="sec">כל חודש</div><div class="card"><table class="ledger"><thead><tr><th>חודש</th><th>צריך להגיע</th><th>התקבל</th><th>מצב</th></tr></thead><tbody>';
    keys.forEach(function(k){var x=months[k],st;
      if(x.me<0.5&&x.acc>0)st='<span class="tag acc">נוסף לקרן '+money(x.acc)+'</span>';
      else if(x.recv>=x.me-0.5)st='<span class="tag ok">שולם</span>';
      else if(k===NOW)st='<span class="tag due">החודש</span>';
      else st='<span class="tag late">חסר '+money(x.me-x.recv)+'</span>';
      h+='<tr><td class="k">'+mName(k)+'</td><td>'+money(x.me)+'</td><td>'+money(x.recv)+'</td><td>'+st+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  // payments list
  var pays=[];ls.forEach(function(l,i){(l.payments||[]).forEach(function(x){pays.push({l:l,i:i,x:x})})});
  pays.sort(function(a,b){return a.x.date<b.x.date?1:-1});
  h+='<div class="sec">תשלומים שנרשמו</div><div class="card pay-list">';
  if(!pays.length)h+='<div class="empty" style="padding:12px">עוד לא נרשמו תשלומים.</div>';
  pays.forEach(function(o){h+='<div class="row"><div><b>'+money(o.x.amount)+'</b> '+(o.x.kind==='fee'?'עמלה':'החזר קרן')+'<span>'+esc(o.x.date)+', על '+mName(o.x.month)+', הלוואה '+(o.i+1)+(o.x.note?', '+esc(o.x.note):'')+'</span></div><button class="x" onclick="delPay(\''+o.l.id+'\',\''+o.x.id+'\')" aria-label="מחיקת תשלום">מחק</button></div>'});
  h+='</div>';
  h+='<div class="acts"><button class="btn sec2" onclick="openLoanSheet(null,\''+pid+'\')">+ הלוואה נוספת</button><button class="btn sec2" onclick="openPerson(\''+pid+'\')">עריכת פרטים</button></div>';
  $('view').innerHTML=h;
}
function planHtml(l){
  var ps=(l.periods||[]).slice().sort(function(a,b){return a.from<b.from?-1:1});
  var cur=periodAt(l,NOW),s='<div class="plan"><b>ההסדר לאורך זמן</b>';
  ps.forEach(function(x,i){
    var st=x===cur?'<span class="st now">עכשיו</span>':(x.from>NOW?'<span class="st fut">מתוכנן</span>':'<span class="st past">הסתיים</span>');
    s+='<div class="step '+x.mode+'"><i></i><div><b>'+mName(x.from)+'</b>'+st+'<span>'+(x.mode==='acc'?'צבירה: כל העמלה נוספת לקרן':'תשלום כל חודש')+', '+pct(x.rate)+' לחודש, '+pct(x.share)+' לסוכן'+(i>0?' <button class="x" style="padding:0 4px" onclick="delPeriod(\''+l.id+'\','+i+')">בטל</button>':'')+'</span></div></div>';
  });
  return s+'</div>';
}

/* ================= sheets ================= */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('sheet').hidden=false;$('veil').hidden=false;var f=$('sheet').querySelector('input,select,textarea');if(f&&window.innerWidth>700)f.focus()}
function closeSheet(){$('sheet').hidden=true;$('veil').hidden=true}
function monthOptions(sel,from,count){var s='',m=from;for(var i=0;i<count;i++){s+='<option value="'+m+'"'+(m===sel?' selected':'')+'>'+mName(m)+'</option>';m=addM(m,1)}return s}
function peopleOptions(sel){return D.people.slice().sort(function(a,b){return a.name.localeCompare(b.name,'he')}).map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
function pickOpt(b){b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)})}
function optVal(id){var b=$(id).querySelector('.on');return b?b.dataset.v:null}

/* loan add / edit */
function openLoanSheet(lid,pid){
  var l=lid?D.loans.find(function(x){return x.id===lid}):null,per=l?l.periods[0]:{mode:'pay',rate:20,share:25};
  var h='<h2>'+(l?'עריכת הלוואה':'הלוואה חדשה')+'</h2><div class="sub">'+(l?'שינוי אחוזים מחודש מסוים עושים ב"שנה הסדר". כאן מתקנים פרטים שנרשמו לא נכון.':'כסף שנתת לאדם, והתנאים שסיכמתם.')+'</div><div class="err" id="fErr"></div>';
  h+='<div class="fl"><label for="fP">למי</label><select id="fP" onchange="$(\'fNewWrap\').hidden=this.value!==\'__new\'"><option value="__new">+ אדם חדש</option>'+peopleOptions(l?l.personId:pid)+'</select></div>';
  h+='<div class="fl" id="fNewWrap"'+((l||pid||D.people.length)?' hidden':'')+'><label for="fNew">שם האדם החדש</label><input id="fNew" autocomplete="off"></div>';
  h+='<div class="two"><div class="fl"><label for="fAmt">קרן (฿)</label><input id="fAmt" inputmode="decimal" value="'+(l?l.principal:'')+'" oninput="loanPrev()"></div><div class="fl"><label for="fStart">מחודש</label><select id="fStart">'+monthOptions(l?l.start:NOW,addM(NOW,-24),30)+'</select></div></div>';
  if(!l){
    h+='<div class="fl"><label>מה קורה עם העמלה</label><div class="opts" id="fMode"><button data-v="pay" class="on" onclick="pickOpt(this);loanPrev()">תשלום כל חודש<small>הקרן נשארת</small></button><button data-v="acc" onclick="pickOpt(this);loanPrev()">צבירה<small>כל העמלה נוספת לקרן</small></button></div></div>';
    h+='<div class="two"><div class="fl"><label for="fRate">אחוז לחודש</label><input id="fRate" inputmode="decimal" value="'+per.rate+'" oninput="loanPrev()"></div><div class="fl"><label for="fShare">חלק הסוכן %</label><input id="fShare" inputmode="decimal" value="'+per.share+'" oninput="loanPrev()"></div></div>';
  }
  h+='<div class="two"><div class="fl"><label for="fTerm">תקופה (חודשים)</label><input id="fTerm" inputmode="numeric" value="'+(l&&l.term?l.term:'')+'"></div><div class="fl"><label for="fRef">לקוח רשום (לא חובה)</label><input id="fRef" value="'+esc(l?l.clientRef:'')+'"></div></div>';
  h+='<div class="fl"><label for="fNote">הערה</label><input id="fNote" value="'+esc(l?l.note:'')+'"></div>';
  if(!l)h+='<div class="prev" id="fPrev"></div>';
  h+='<button class="btn pri full" onclick="saveLoan('+(l?'\''+l.id+'\'':'null')+')">'+(l?'שמור שינויים':'צור הלוואה')+'</button>';
  if(l)h+='<div class="acts"><button class="btn sec2" onclick="closeLoan(\''+l.id+'\')">סגירת הלוואה (שולמה)</button><button class="btn danger" onclick="askDelLoan(\''+l.id+'\')">מחיקה</button></div>';
  openSheet(h);
  $('fP').value=l?l.personId:(pid||'__new');
  $('fNewWrap').hidden=$('fP').value!=='__new';
  if(!l)loanPrev();
}
function loanPrev(){var el=$('fPrev');if(!el)return;var a=num($('fAmt').value),r=num($('fRate').value),s=num($('fShare').value),mode=optVal('fMode');
  if(!(a>0)||!(r>=0)){el.textContent='הזן קרן ואחוז כדי לראות חישוב.';return}
  var fee=a*r/100;el.textContent=mode==='acc'?'כל חודש '+money(fee)+' נוספים לקרן, והקרן גדלה.':'כל חודש '+money(fee)+': אליך '+money(fee*(1-(s||0)/100))+', לסוכן '+money(fee*(s||0)/100)+'.'}
function saveLoan(lid){
  var err=$('fErr'),pid=$('fP').value,a=num($('fAmt').value);
  if(pid==='__new'){var nm=($('fNew').value||'').trim();if(!nm){err.textContent='חסר שם לאדם החדש.';return}var np={id:uid(),name:nm};D.people.push(np);pid=np.id}
  if(!(a>0)){err.textContent='הקרן צריכה להיות מספר גדול מ-0.';return}
  var term=num($('fTerm').value);
  if(lid){var l=D.loans.find(function(x){return x.id===lid});l.personId=pid;l.principal=a;l.start=$('fStart').value;l.term=term>0?term:null;l.clientRef=$('fRef').value.trim();l.note=$('fNote').value.trim();
    if(l.periods[0].from>l.start)l.periods[0].from=l.start; l.periods.sort(function(x,y){return x.from<y.from?-1:1}); l.periods[0].from=l.start;}
  else{var r=num($('fRate').value),s=num($('fShare').value);if(!(r>=0)||!(s>=0)||s>100){err.textContent='בדוק את האחוזים.';return}
    D.loans.push({id:uid(),personId:pid,principal:a,start:$('fStart').value,term:term>0?term:null,clientRef:$('fRef').value.trim(),note:$('fNote').value.trim(),periods:[{from:$('fStart').value,mode:optVal('fMode'),rate:r,share:s}],payments:[]});}
  closeSheet();save(true);toast(lid?'נשמר':'ההלוואה נוצרה');go('p',pid);
}
function closeLoan(lid){var l=D.loans.find(function(x){return x.id===lid});l.closed=new Date().toISOString().slice(0,10);closeSheet();save(true);toast('ההלוואה נסגרה');render()}
function askDelLoan(lid){openSheet('<h2>למחוק את ההלוואה?</h2><div class="sub">ההלוואה וכל התשלומים שלה יימחקו מהאפליקציה החדשה. האפליקציה הישנה לא מושפעת. אם ההלוואה פשוט שולמה, עדיף "סגירת הלוואה".</div><div class="acts"><button class="btn danger" onclick="delLoan(\''+lid+'\')">כן, למחוק</button><button class="btn sec2" onclick="closeSheet()">ביטול</button></div>')}
function delLoan(lid){var l=D.loans.find(function(x){return x.id===lid});D.loans=D.loans.filter(function(x){return x.id!==lid});closeSheet();save(true);toast('נמחק');go('p',l.personId)}

/* arrangement */
function openPlan(lid){
  var l=D.loans.find(function(x){return x.id===lid}),cur=periodAt(l,NOW),p=person(l.personId);
  var h='<h2>שינוי הסדר</h2><div class="sub">הלוואה של '+esc(p.name)+'. ההסדר הקודם נשמר בהיסטוריה.</div><div class="err" id="fErr"></div>'+
    '<div class="fl"><label>מה קורה עם העמלה</label><div class="opts" id="fMode"><button data-v="pay" class="'+(cur.mode==='acc'?'on':'')+'" onclick="pickOpt(this);planPrev()">תשלום כל חודש<small>הקרן נשארת, משלמים לך</small></button><button data-v="acc" class="'+(cur.mode==='acc'?'':'on')+'" onclick="pickOpt(this);planPrev()">צבירה<small>כל העמלה נוספת לקרן</small></button></div></div>'+
    '<div class="fl"><label for="fFrom">החל מחודש</label><select id="fFrom" onchange="planPrev()">'+monthOptions(addM(NOW,1)>l.start?addM(NOW,1):l.start,addM(NOW,-3)>l.start?addM(NOW,-3):l.start,18)+'</select></div>'+
    '<div class="two"><div class="fl"><label for="fRate">אחוז לחודש</label><input id="fRate" inputmode="decimal" value="'+cur.rate+'" oninput="planPrev()"></div><div class="fl"><label for="fShare">חלק הסוכן %</label><input id="fShare" inputmode="decimal" value="'+cur.share+'" oninput="planPrev()"></div></div>'+
    '<div class="prev" id="fPrev"></div><button class="btn pri full" onclick="savePlan(\''+lid+'\')">שמור הסדר חדש</button>';
  openSheet(h);planPrev();
}
function planPrev(){var f=$('fFrom').value,mode=optVal('fMode'),r=$('fRate').value,s=$('fShare').value;
  $('fPrev').textContent='עד סוף '+mName(addM(f,-1))+' נשאר ההסדר הנוכחי. מ'+mName(f)+': '+(mode==='acc'?'כל העמלה ('+r+'% לחודש) נוספת לקרן ולא משולמת.':'הקרן נשארת קבועה, '+r+'% לחודש, '+s+'% לסוכן והשאר אליך.')+' מה שכבר נצבר נשאר בקרן.'}
function savePlan(lid){var l=D.loans.find(function(x){return x.id===lid}),f=$('fFrom').value,r=num($('fRate').value),s=num($('fShare').value);
  if(!(r>=0)||!(s>=0)||s>100){$('fErr').textContent='בדוק את האחוזים.';return}
  if(f<l.start){$('fErr').textContent='החודש לפני תחילת ההלוואה.';return}
  l.periods=l.periods.filter(function(x){return x.from!==f});l.periods.push({from:f,mode:optVal('fMode'),rate:r,share:s});l.periods.sort(function(a,b){return a.from<b.from?-1:1});
  closeSheet();save(true);toast('ההסדר נשמר');render()}
function delPeriod(lid,i){var l=D.loans.find(function(x){return x.id===lid}),ps=l.periods.slice().sort(function(a,b){return a.from<b.from?-1:1});if(i<1)return;var rm=ps[i];
  openSheet('<h2>לבטל את ההסדר מ'+mName(rm.from)+'?</h2><div class="sub">ההסדר הקודם ימשיך גם בחודשים האלה.</div><div class="acts"><button class="btn danger" id="okDel">כן, לבטל</button><button class="btn sec2" onclick="closeSheet()">ביטול</button></div>');
  $('okDel').onclick=function(){l.periods=l.periods.filter(function(x){return x!==rm});closeSheet();save(true);toast('בוטל');render()}}

/* payments */
function openPay(lid){
  var l=D.loans.find(function(x){return x.id===lid}),c=calcLoan(l),p=person(l.personId);
  var h='<h2>רישום תשלום</h2><div class="sub">'+esc(p.name)+'. צפוי ממנו החודש: '+money(c.cur.me)+'.</div><div class="err" id="fErr"></div>'+
    '<div class="fl"><label>סוג</label><div class="opts" id="fKind"><button data-v="fee" class="on" onclick="pickOpt(this)">עמלה<small>החלק שמגיע לך</small></button><button data-v="principal" onclick="pickOpt(this)">החזר קרן<small>מקטין את הקרן</small></button></div></div>'+
    '<div class="two"><div class="fl"><label for="fAmt">סכום (฿)</label><input id="fAmt" inputmode="decimal" value="'+(c.cur.me>0?Math.round(c.cur.me):'')+'"></div><div class="fl"><label for="fMon">על חודש</label><select id="fMon">'+monthOptions(NOW,l.start<addM(NOW,-12)?addM(NOW,-12):l.start,24)+'</select></div></div>'+
    '<div class="two"><div class="fl"><label for="fDate">תאריך</label><input id="fDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="fl"><label for="fNote">הערה</label><input id="fNote"></div></div>'+
    '<button class="btn pri full" onclick="savePay(\''+lid+'\')">שמור תשלום</button>';

}
function savePay(lid){var l=D.loans.find(function(x){return x.id===lid}),a=num($('fAmt').value);if(!(a>0)){$('fErr').textContent='הסכום צריך להיות גדול מ-0.';return}
  l.payments=l.payments||[];l.payments.push({id:uid(),date:$('fDate').value||new Date().toISOString().slice(0,10),month:$('fMon').value,kind:optVal('fKind'),amount:a,note:$('fNote').value.trim()});
  closeSheet();save(true);toast('התשלום נרשם');render()}
function delPay(lid,pid){openSheet('<h2>למחוק את התשלום?</h2><div class="acts"><button class="btn danger" id="okDel">כן, למחוק</button><button class="btn sec2" onclick="closeSheet()">ביטול</button></div>');
  $('okDel').onclick=function(){var l=D.loans.find(function(x){return x.id===lid});l.payments=l.payments.filter(function(x){return x.id!==pid});closeSheet();save(true);toast('נמחק');render()}}

/* person edit */
function openPerson(pid){var p=person(pid);
  openSheet('<h2>פרטי אדם</h2><div class="err" id="fErr"></div><div class="fl"><label for="fName">שם</label><input id="fName" value="'+esc(p.name)+'"></div><div class="fl"><label for="fNote">הערה</label><input id="fNote" value="'+esc(p.note)+'"></div>'+
    '<div class="fl"><label for="fMerge">איחוד עם אדם אחר (אותו אדם נרשם פעמיים)</label><select id="fMerge"><option value="">לא לאחד</option>'+D.people.filter(function(x){return x.id!==pid}).map(function(x){return '<option value="'+x.id+'">להעביר את כל ההלוואות של '+esc(x.name)+' לכאן</option>'}).join('')+'</select></div>'+
    '<button class="btn pri full" onclick="savePerson(\''+pid+'\')">שמור</button>')}
function savePerson(pid){var p=person(pid),nm=$('fName').value.trim();if(!nm){$('fErr').textContent='חסר שם.';return}p.name=nm;p.note=$('fNote').value.trim();

/* ================= more / settings ================= */
function renderMore(){

  else h+='<div class="row"><div><b>הנתונים שמורים רק בטלפון</b><span>כדי שלא יאבדו, מתחברים לענן עם מייל.</span></div><button class="btn pri" onclick="openCloud()">חיבור</button></div>';

     '<button class="row" onclick="openImport()"><div><b>העתקה מהאפליקציה הישנה</b><span>קורא בלבד. הישנה לא משתנה.</span></div><span class="chev">‹</span></button>'+
     '<button class="row" onclick="openExport()"><div><b>גיבוי ידני</b><span>כל הנתונים כטקסט להעתקה ושמירה.</span></div><span class="chev">‹</span></button>'+
     '<button class="row" onclick="openRestore()"><div><b>שחזור מגיבוי</b><span>מחליף את הנתונים בטלפון בגיבוי שהדבקת.</span></div><span class="chev">‹</span></button></div>';
  h+='<div class="sec">אבטחה</div><div class="card set">'+
     (bioId()?'<div class="row"><div><b>כניסה בטביעת אצבע פעילה</b><span>בכל פתיחה של האפליקציה בטלפון הזה.</span></div><button class="btn sec2" onclick="bioOff()">כבה</button></div><button class="row" onclick="lockNow()"><div><b>נעל עכשיו</b></div><span class="chev">‹</span></button>'
       :'<button class="row" onclick="bioRegister()"><div><b>הפעלת כניסה בטביעת אצבע</b><span>האפליקציה תיפתח רק אחרי טביעת האצבע שלך.</span></div><span class="chev">‹</span></button>')+'</div>';
  h+='<p class="ex">ידידים, גרסה חדשה. נפרדת לגמרי מהאפליקציה הישנה: אחסון אחר, ענן אחר, בלי קוד משותף.</p>';
  $('view').innerHTML=h;
}
function openExport(){openSheet('<h2>גיבוי ידני</h2><div class="sub">לחץ "העתק" ושמור את הטקסט במקום בטוח, למשל בהודעה לעצמך.</div><div class="fl"><textarea id="fTxt" readonly>'+esc(JSON.stringify(D))+'</textarea></div><button class="btn pri full" onclick="copyTxt()">העתק</button>')}
function copyTxt(){var t=$('fTxt');t.select();var ok=function(){toast('הועתק')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand('copy');ok()});else{document.execCommand('copy');ok()}}
function openRestore(){openSheet('<h2>שחזור מגיבוי</h2><div class="sub">הדבק גיבוי שנשמר מהאפליקציה החדשה. הנתונים בטלפון יוחלפו בו.</div><div class="err" id="fErr"></div><div class="fl"><textarea id="fTxt" placeholder="הדבק כאן"></textarea></div><button class="btn danger full" onclick="doRestore()">שחזר</button>')}
function doRestore(){try{var x=JSON.parse($('fTxt').value);if(!x||!Array.isArray(x.people)||!Array.isArray(x.loans))throw 0;D=x;closeSheet();save(true);toast('שוחזר');go('home')}catch(e){$('fErr').textContent='זה לא נראה כמו גיבוי של האפליקציה החדשה.'}}

/* import from old app (read only: the user pastes the old "show backup" text) */
function openImport(){openSheet('<h2>העתקה מהאפליקציה הישנה</h2><div class="sub">באפליקציה הישנה: גיבוי ושחזור, ואז "הצג נתוני גיבוי". מסמנים הכול, מעתיקים ומדביקים כאן. הישנה לא משתנה בכלל.</div><div class="err" id="fErr"></div><div class="fl"><textarea id="fTxt" placeholder="הדבק כאן"></textarea></div><div class="prev" id="fPrev" hidden></div><button class="btn pri full" id="impBtn" onclick="previewImport()">בדיקה לפני העתקה</button>')}
var IMP=null;
function convertOld(x){
  if(!x||!Array.isArray(x.agents))throw new Error('bad');
  var people=[],loans=[];
  x.agents.forEach(function(a){
    var p={id:uid(),name:String(a.name||'ללא שם').trim()};people.push(p);
    var fs=(a.feeSettings||[]).filter(function(s){return s.scope!=='month'}).slice(-1)[0],mode=fs&&fs.mode==='accumulate'?'acc':'pay';
    (a.clients||[]).forEach(function(c){
      var paid=(c.repayments||[]).reduce(function(s,r){return s+(+r.amount||0)},0),bal=Math.max(0,(+c.amount||0)-paid);
      if(bal<=0)return;
      var rate=(c.feeRate===null||c.feeRate===undefined||c.feeRate==='')?(+a.monthlyFee||0):(+c.feeRate||0);
      if(c.feeType==='daily')rate=rate*30.44;
      if(c.feeType==='fixed')rate=bal>0?((+c.fixedFee||0)/Math.max(1,+c.termDays||90)*30.44)/bal*100:0;
      loans.push({id:uid(),personId:p.id,principal:bal,start:NOW,term:+c.months||null,clientRef:String(c.name||''),note:paid>0?'יובא מהישנה. שולם בעבר '+money(paid)+' מהקרן המקורית '+money(c.amount):'יובא מהאפליקציה הישנה',
        periods:[{from:NOW,mode:mode,rate:Math.round(rate*100)/100,share:+a.agentShare||0}],payments:[]});
    });
  });
  return {v:1,rev:0,updated:null,people:people,loans:loans};
}
function previewImport(){
  try{IMP=convertOld(JSON.parse($('fTxt').value))}catch(e){$('fErr').textContent='הטקסט לא נראה כמו הגיבוי של האפליקציה הישנה. ודא שהעתקת הכול, מהסוגר הראשון עד האחרון.';return}
  $('fErr').textContent='';var tot=IMP.loans.reduce(function(s,l){return s+l.principal},0);
  var el=$('fPrev');el.hidden=false;el.innerHTML='נמצאו '+IMP.people.length+' אנשים ו-'+IMP.loans.length+' הלוואות, סך קרן '+money(tot)+'.'+(D.people.length?'<br><b>שים לב:</b> זה יחליף את מה שכבר יש באפליקציה החדשה.':'')+'<br>כל ההלוואות יתחילו מ'+mName(NOW)+'. אחרי ההעתקה אפשר לאחד אנשים שנרשמו פעמיים ולקבוע הסדר צבירה למי שצריך.';
  var b=$('impBtn');b.textContent='העתק לאפליקציה החדשה';b.onclick=function(){D=IMP;IMP=null;closeSheet();save(true);toast('הנתונים הועתקו');go('home')};
}

/* ================= fingerprint lock (device biometrics via passkey; nothing secret is stored) ================= */
var FINGER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v3a7 7 0 0 1-1.5 4.3"/><path d="M8.5 8.6A4 4 0 0 1 16 11v2.5"/><path d="M5.5 15.5A10 10 0 0 0 6 11a6 6 0 0 1 9-5.2"/><path d="M18 9.5c.3.5.5 1 .6 1.5.2 1.9 0 3.8-.6 5.6"/><path d="M15.5 17.5a11 11 0 0 1-1.3 3"/></svg>';
function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function bioOK(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}
function bioId(){return lsGet(PINKEY)}
async function bioRegister(){
  if(!bioOK()){toast('הדפדפן הזה לא תומך בטביעת אצבע');return}
  try{
    var cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ידידים',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'yedidim',displayName:'ידידים'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    lsSet(PINKEY,b64u(cred.rawId));try{sessionStorage.setItem(UNLOCK,'1')}catch(e){}toast('טביעת האצבע הופעלה');render();
  }catch(e){toast('ההפעלה בוטלה או נכשלה')}
}
async function bioUnlock(){
  var id=bioId();if(!id)return;var msg=document.querySelector('#lock .msg');if(msg)msg.textContent='';
  try{
    var ok=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:fromB64u(id)}],userVerification:'required',timeout:60000}});
    if(ok){try{sessionStorage.setItem(UNLOCK,'1')}catch(e){}$('lock').hidden=true}
  }catch(e){if(msg)msg.textContent='לא זוהה. גע שוב בכפתור.'}
}
function drawLock(){
  $('lock').innerHTML='<div class="mark">ידי<span>דים</span></div><p>גע בטביעת האצבע כדי להיכנס</p><button class="finger" onclick="bioUnlock()" aria-label="כניסה בטביעת אצבע">'+FINGER+'</button><div class="msg"></div><button class="help" onclick="bioHelp()">טביעת האצבע לא עובדת?</button>';
}
function bioHelp(){
  $('lock').innerHTML='<div class="mark">ידי<span>דים</span></div><p style="max-width:330px;line-height:1.6">אפשר להסיר את הנעילה מהטלפון הזה. כדי שאף אחד אחר לא יוכל לעשות את זה ולראות נתונים, ההעתק שבטלפון יימחק. הנתונים לא הולכים לאיבוד: הם בענן, וחוזרים אחרי כניסה עם המייל שלך.</p>'+
    '<button class="btn danger" style="margin-top:18px" onclick="bioReset()">הסר נעילה ומחק את ההעתק בטלפון</button><button class="help" onclick="drawLock()">חזרה</button>';
}
function bioReset(){try{localStorage.removeItem(KEY);localStorage.removeItem(PINKEY);localStorage.removeItem('yd2.auth')}catch(e){}D=blank();$('lock').hidden=true;go('more');toast('הנעילה הוסרה. התחבר לענן כדי להחזיר את הנתונים.')}
function bioOff(){try{localStorage.removeItem(PINKEY)}catch(e){}toast('טביעת האצבע כובתה');render()}
function lockNow(){try{sessionStorage.removeItem(UNLOCK)}catch(e){}checkLock()}
function checkLock(){var u=null;try{u=sessionStorage.getItem(UNLOCK)}catch(e){}if(bioId()&&!u){$('lock').hidden=false;drawLock();setTimeout(bioUnlock,250)}}

/* ================= cloud (own table, own auth storage key) ================= */
var CLOUD_URL='https://ayqzwlvgxupbxhvrnrke.supabase.co';
var CLOUD_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cXp3bHZneHVwYnhodnJucmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQxNzksImV4cCI6MjEwNjU5MDE3OX0.jtWagMsm0w4DVQ9ZGO43y9myP3yOcUpN3au-gpuvdQg'; /* public anon key: safe only because the table is locked to its owner */
var TABLE='yd_state';
var cloud={sb:null,user:null,state:'local',last:null,msg:'',timer:null};
function cloudInit(){
  if(!window.supabase)return;
  cloud.sb=window.supabase.createClient(CLOUD_URL,CLOUD_KEY,{auth:{storageKey:'yd2.auth',persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
  cloud.sb.auth.onAuthStateChange(function(ev,session){cloud.user=session?session.user:null;if(cloud.user){cloudPull()}else{cloud.state='local';render()}});
}
function openCloud(){openSheet('<h2>חיבור לענן</h2><div class="sub">נשלח אליך קישור כניסה למייל. פותחים אותו בטלפון הזה, והנתונים נשמרים בענן ולא יאבדו.</div><div class="err" id="fErr"></div><div class="fl"><label for="fMail">מייל</label><input id="fMail" type="email" inputmode="email" autocomplete="email"></div><button class="btn pri full" id="mailBtn" onclick="sendLink()">שלח לי קישור</button>')}
async function sendLink(){var m=($('fMail').value||'').trim();if(!/^\S+@\S+\.\S+$/.test(m)){$('fErr').textContent='המייל לא נראה תקין.';return}
  if(!cloud.sb){$('fErr').textContent='אין חיבור לאינטרנט כרגע.';return}
  $('mailBtn').textContent='שולח…';var r=await cloud.sb.auth.signInWithOtp({email:m,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
  if(r.error){$('fErr').textContent='השליחה נכשלה: '+r.error.message;$('mailBtn').textContent='שלח לי קישור';return}
  $('sheet').innerHTML='<div class="grab"></div><h2>נשלח</h2><div class="sub">פתח את המייל בטלפון הזה ולחץ על הקישור. האפליקציה תיפתח מחוברת.</div><button class="btn pri full" onclick="closeSheet()">סגור</button>'}
async function cloudOut(){if(cloud.sb)await cloud.sb.auth.signOut();cloud.user=null;cloud.state='local';render()}
async function cloudPull(){
  cloud.state='busy';cloud.msg='';render();
  var r=await cloud.sb.from(TABLE).select('data,rev,updated_at').eq('owner_id',cloud.user.id).maybeSingle();
  if(r.error){cloud.state='err';cloud.msg=r.error.code==='42P01'||/does not exist|schema cache/i.test(r.error.message)?'הענן של האפליקציה החדשה עוד לא הוגדר. נגדיר אותו יחד.':'קריאה מהענן נכשלה: '+r.error.message;return render()}
  if(r.data&&r.data.data&&(+r.data.rev||0)>(+D.rev||0)){D=r.data.data;lsSet(KEY,JSON.stringify(D));toast('נטען מהענן')}
  else if(!r.data||(+D.rev||0)>(+r.data.rev||0)){await cloudPush()}
  cloud.state='ok';cloud.last=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});render();
}
function cloudQueue(){if(!cloud.user)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,800)}
async function cloudPush(){
  if(!cloud.user||!cloud.sb)return;cloud.state='busy';
  var r=await cloud.sb.from(TABLE).upsert({owner_id:cloud.user.id,data:D,rev:D.rev||0,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
  if(r.error){cloud.state='err';cloud.msg='שמירה בענן נכשלה: '+r.error.message}else{cloud.state='ok';cloud.msg='';cloud.last=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
  if(route.v!=='p'||$('sheet').hidden)render();
}

/* ================= start ================= */
load();readHash();render();checkLock();
try{cloudInit()}catch(e){cloud.state='err';cloud.msg='טעינת הענן נכשלה'}
</script>
