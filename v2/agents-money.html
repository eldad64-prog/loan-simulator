<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>עמלות סוכנים</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fb;color:#1d2433;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  h1{font-size:22px;margin:8px 0 4px}
  .muted{color:#6b7385;font-size:14px}
  .card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(20,30,60,.08)}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .tot{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.08)}
  .tot b{display:block;font-size:20px}
  .tot span{color:#6b7385;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  input,select{font:inherit;padding:10px;border:1px solid #d7dce5;border-radius:12px;background:#fff;color:#1d2433;min-width:0}
  input[type=number]{width:120px}
  input[type=date]{width:150px}
  select{flex:1;min-width:150px}
  button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:#e8eefb;color:#1d2433;cursor:pointer}
  button.primary{background:#3b6fd8;color:#fff}
  button.ghost{background:#fff;border:1px solid #d7dce5}
  .mode{display:inline-block;padding:4px 10px;border-radius:999px;background:#e8eefb;font-size:14px}
  .mode.acc{background:#e3f5ec;color:#16633f}
  .ledger{margin-top:10px;font-size:14px;color:#4a5263}
  .ledger div{padding:4px 0;border-bottom:1px solid #eef1f6}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 4px;border-bottom:1px solid #eef1f6;vertical-align:middle}
  td input{width:100%}
  .sec{font-weight:700;margin:14px 0 6px}
  .foot{margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>עמלות סוכנים</h1>
  <div id="app"></div>
  <div id="cloudStatus" class="muted" style="margin-top:12px"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
const OLD_KEY = "loan_portfolios_v3";
const NEW_KEY = "agents_money_v1";
const MODE = { monthly: "הפרשה חודשית", accumulate: "צבירה בקופה" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money = n => "₪" + Number(n || 0).toLocaleString("he-IL", { maximumFractionDigits: 0 });
const today = () => new Date().toISOString().slice(0, 10);

function loadNew(){ try { return JSON.parse(localStorage.getItem(NEW_KEY) || "null"); } catch(e) { return null; } }
function persist(s){
  s.savedAt = new Date().toISOString();
  try { localStorage.setItem(NEW_KEY, JSON.stringify(s)); } catch(e) { alert("השמירה נכשלה"); }
  cloudPush(s);
}

const CLOUD_URL = "https://ayqzwlvgxupbxhvrnrke.supabase.co";
const CLOUD_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cXp3bHZneHVwYnhodnJucmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQxNzksImV4cCI6MjEwNjU5MDE3OX0.jtWagMsm0w4DVQ9ZGO43y9myP3yOcUpN3au-gpuvdQg";
const CLOUD_TABLE = "loan_agents_money";
let cloud = null;

function cloudClient(){
  if(cloud) return cloud;
  try {
    if(!window.supabase || !window.supabase.createClient) return null;
    cloud = window.supabase.createClient(CLOUD_URL, CLOUD_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  } catch(e) { cloud = null; }
  return cloud;
}
function setCloudStatus(t){ const el = $("cloudStatus"); if(el) el.textContent = t; }
async function cloudUser(){
  const c = cloudClient();
  if(!c) return null;
  try { const r = await c.auth.getUser(); return (r && r.data && r.data.user) || null; } catch(e) { return null; }
}
async function cloudPush(s){
  try {
    const c = cloudClient();
    const u = await cloudUser();
    if(!c || !u){ setCloudStatus("לא מחובר לענן. המספרים נשמרים רק במכשיר הזה."); return; }
    const { error } = await c.from(CLOUD_TABLE).upsert({ owner_id: u.id, data: s, updated_at: s.savedAt }, { onConflict: "owner_id" });
    if(error) throw error;
    setCloudStatus("☁️ נשמר בענן");
  } catch(e) {
    setCloudStatus("שמירה לענן נכשלה: " + (e.message || e));
  }
}
async function cloudPull(){
  const c = cloudClient();
  const u = await cloudUser();
  if(!c || !u){ setCloudStatus("לא מחובר לענן. המספרים נשמרים רק במכשיר הזה."); return false; }
  const { data, error } = await c.from(CLOUD_TABLE).select("data,updated_at").eq("owner_id", u.id).maybeSingle();
  if(error) throw error;
  if(!data){ if(S) await cloudPush(S); return false; }
  const remoteTime = Date.parse(data.updated_at) || 0;
  const localTime = S && S.savedAt ? Date.parse(S.savedAt) || 0 : 0;
  if(!S || remoteTime > localTime){
    S = data.data;
    try { localStorage.setItem(NEW_KEY, JSON.stringify(S)); } catch(e) {}
    return true;
  }
  if(S && localTime > remoteTime) await cloudPush(S);
  return false;
}

function readOldAgentNumbers(){
  let x = null;
  try { x = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); } catch(e) {}
  const list = x && Array.isArray(x.agents) ? x.agents : [];
  return list.map((a, i) => ({
    id: Number(a.id) || i + 1,
    name: a.name || ("סוכן " + (i + 1)),
    share: Number(a.agentShare ?? a.agentFee) || 0,
    fee: Number(a.monthlyFee ?? a.fee) || 0,
    budget: Number(a.budget) || 0
  }));
}

let S = loadNew();

function modeAt(a, d){
  const list = (a.modes || []).filter(m => m.from <= d).sort((x, y) => x.from < y.from ? -1 : x.from > y.from ? 1 : 0);
  return list.length ? list[list.length - 1].mode : "monthly";
}

function renderSetup(){
  const rows = readOldAgentNumbers();
  if(!rows.length){
    $("app").innerHTML = '<div class="card">אין עדיין סוכנים לקריאה. הוסף סוכנים במסך הניהול ואז חזור לכאן.</div>';
    return;
  }
  let html = '<p class="muted">קראתי את המספרים של הסוכנים. בדוק, תקן במידת הצורך, ואשר. מרגע האישור ימשיכו לחיות כאן רק המספרים שאישרת.</p>';
  html += '<div class="card"><table><tr><td>סוכן</td><td>חלק סוכן %</td><td>שיעור ברירת מחדל %</td><td>קופה ₪</td></tr>';
  rows.forEach((r, i) => {
    html += '<tr><td><input id="n'+i+'" value="'+esc(r.name)+'"></td>' +
      '<td><input id="s'+i+'" type="number" step="0.1" value="'+r.share+'"></td>' +
      '<td><input id="f'+i+'" type="number" step="0.1" value="'+r.fee+'"></td>' +
      '<td><input id="b'+i+'" type="number" step="1" value="'+r.budget+'"></td></tr>';
  });
  html += '</table><div class="row"><button class="primary" onclick="approve('+rows.length+')">אישור המספרים</button></div></div>';
  $("app").innerHTML = html;
}

function approve(count){
  const agents = [];
  for(let i = 0; i < count; i++){
    agents.push({
      id: i + 1,
      name: $("n"+i).value.trim() || ("סוכן " + (i + 1)),
      share: Number($("s"+i).value) || 0,
      fee: Number($("f"+i).value) || 0,
      budget: Number($("b"+i).value) || 0,
      modes: [{ from: today(), mode: "monthly" }],
      ledger: []
    });
  }
  S = { approvedAt: today(), agents };
  persist(S);
  render();
}

function totalsHtml(){
  const budgets = S.agents.reduce((s, a) => s + (Number(a.budget) || 0), 0);
  const accCount = S.agents.filter(a => modeAt(a, today()) === "accumulate").length;
  return '<div class="totals"><div class="tot"><b>'+money(budgets)+'</b><span>סה״כ קופה</span></div>' +
    '<div class="tot"><b>'+accCount+' / '+S.agents.length+'</b><span>סוכנים בצבירה</span></div></div>';
}

function agentCard(a, i){
  const cur = modeAt(a, today());
  const led = (a.ledger || []).slice(-5).reverse();
  return '<div class="card">' +
    '<div class="row" style="justify-content:space-between;margin-top:0"><b>'+esc(a.name)+'</b>' +
    '<span class="mode '+(cur==="accumulate"?"acc":"")+'">'+MODE[cur]+'</span></div>' +
    '<div class="muted" style="margin-top:6px">חלק סוכן '+a.share+'% · שיעור ברירת מחדל '+a.fee+'%</div>' +
    '<div class="row"><span>קופה:</span><input type="number" step="1" value="'+(Number(a.budget)||0)+'" onchange="setBudget('+i+',this.value)"></div>' +
    '<div class="sec">שינוי מצב</div>' +
    '<div class="row"><select id="m'+i+'">' +
      '<option value="monthly"'+(cur==="monthly"?' selected':'')+'>הפרשה חודשית</option>' +
      '<option value="accumulate"'+(cur==="accumulate"?' selected':'')+'>צבירה בקופה</option>' +
    '</select><input id="d'+i+'" type="date" value="'+today()+'"><button onclick="changeMode('+i+')">החל מתאריך</button></div>' +
    '<div class="sec">רישום עמלה</div>' +
    '<div class="row"><input id="v'+i+'" type="number" step="1" placeholder="סכום ₪"><button class="primary" onclick="record('+i+')">רשום</button></div>' +
    (led.length ? '<div class="ledger">'+led.map(x=>'<div>'+esc(x.date)+' · '+money(x.amount)+' · '+(x.toBudget?'נצבר בקופה':'הופרש / שולם')+'</div>').join('')+'</div>' : '') +
    '</div>';
}

function renderMain(){
  let html = '<p class="muted">מאושר מ-'+esc(S.approvedAt)+'</p>' + totalsHtml();
  S.agents.forEach((a, i) => { html += agentCard(a, i); });
  html += '<div class="foot"><button class="ghost" onclick="resetAll()">איפוס האישור</button></div>';
  $("app").innerHTML = html;
}

function setBudget(i, v){
  S.agents[i].budget = Number(v) || 0;
  persist(S); render();
}

function changeMode(i){
  const a = S.agents[i];
  const d = $("d"+i).value || today();
  a.modes.push({ from: d, mode: $("m"+i).value });
  persist(S); render();
}

function record(i){
  const a = S.agents[i];
  const amt = Number($("v"+i).value);
  if(!(amt > 0)){ alert("הזן סכום"); return; }
  const toBudget = modeAt(a, today()) === "accumulate";
  if(toBudget) a.budget = (Number(a.budget) || 0) + amt;
  a.ledger.push({ date: today(), amount: amt, toBudget });
  persist(S); render();
}

function resetAll(){
  if(!confirm("למחוק את האישור ולחזור לקריאה מחדש?")) return;
  try { localStorage.removeItem(NEW_KEY); } catch(e) {}
  S = null; render();
}

function render(){ if(S) renderMain(); else renderSetup(); }

async function boot(){
  render();
  if(!cloudClient()){ setCloudStatus("הענן לא נטען. המספרים נשמרים רק במכשיר הזה."); return; }
  try {
    const changed = await cloudPull();
    if(changed) render();
  } catch(e) {
    setCloudStatus("סנכרון לענן נכשל: " + (e.message || e));
  }
}
boot();
</script>
</body>
</html>
