<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>ידידים - סוכן</title>
<style>
  :root{--blue:#2563eb;--blue2:#1d4ed8;--blueSoft:#eaf1ff;--ink:#172033;--muted:#697386;--line:#e5e9f0;
    --white:#fff;--green:#15945b;--greenSoft:#e8f8f0;--red:#dc3545;--redSoft:#fff0f1;--shadow:0 10px 30px rgba(22,34,55,.07)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#f5f7fb;color:var(--ink);font-size:16px}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;justify-content:flex-start;margin-bottom:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .card-title{font-size:22px;font-weight:900;margin:0}
  .card-sub{color:var(--muted);font-size:14px;line-height:1.5;margin-top:5px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff}
  .kpi::before{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--blue)}
  .kpi.green::before{background:var(--green)}
  .kpi .klabel{font-size:14px;color:var(--muted);font-weight:700}
  .kpi .value{font-size:24px;font-weight:900;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi.blue{background:#f4f7ff;border-color:#dce6ff}
  .kpi.green{background:#f1fbf6;border-color:#d5f1e2}
  .notice{background:#fff7e8;border:1px solid #fde7b0;border-radius:14px;padding:12px 14px;color:#7a4a00;font-size:14px;margin-bottom:16px;line-height:1.5}
  .btn{min-height:48px;padding:11px 16px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn.primary{background:var(--blue);color:#fff;width:100%}
  .btn.primary:hover{background:var(--blue2)}
  .btn.light{background:#f2f4f7;color:#303846}
  .btn.danger{background:var(--redSoft);color:#b42332;border:1px solid #fecdd3;min-height:38px;padding:8px 11px;font-size:13px;border-radius:10px}
  .form{display:grid;gap:10px}
  label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:700}
  input{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:17px}
  input:focus{outline:none;border-color:var(--blue)}
  .agent-client-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px 6px;border-bottom:1px solid #edf0f4}
  .agent-client-row:last-child{border-bottom:0}
  .agent-client-name{font-weight:800;font-size:15px}
  .agent-client-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .agent-client-balance{font-size:14px;font-weight:800;white-space:nowrap;text-align:left}
  .agent-client-row .btn{grid-column:1;justify-self:start;margin-top:6px}
  .agent-client-balance{grid-column:2;grid-row:1 / span 2}
  .agent-pick{display:grid;gap:8px}
  .agent-pick a{display:block;text-align:center;padding:12px;border-radius:13px;text-decoration:none;color:var(--ink);background:var(--blueSoft);font-weight:800}
  .empty{color:var(--muted);text-align:center;padding:20px 6px;font-size:15px}
  .hidden{display:none}
  @media (max-width:420px){.kpis{grid-template-columns:1fr}.kpi .value{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="btn light" href="./index.html">→ חזרה לכניסה</a></div>

  <div id="noAgent" class="card hidden">
    <div class="card-head"><div><h2 class="card-title">תיקי סוכנים</h2><div class="card-sub" id="pickHint">בחר סוכן כדי לפתוח את התיק שלו.</div></div></div>
    <div id="agentPick" class="agent-pick"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="card-head"><div><h2 class="card-title" id="agentName"></h2><div class="card-sub">הלקוחות שלך ביד אחת. הוסף או הסר לפי הצורך.</div></div></div>

      <div class="notice">הקופה, אחוזי העמלה והחזרת העמלה נקבעים על ידי המנהל ואי אפשר לשנות אותם מכאן.</div>

      <div class="kpis">
        <div class="kpi blue"><div class="klabel">קופה</div><div class="value" id="kBudget">฿0</div></div>
        <div class="kpi blue"><div class="klabel">נשאר בקופה</div><div class="value" id="kRemain">฿0</div></div>
        <div class="kpi green"><div class="klabel">יתרות הלקוחות</div><div class="value" id="kBal">฿0</div></div>
        <div class="kpi green"><div class="klabel">חלקך בעמלה חודשית</div><div class="value" id="kShare">฿0</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h2 class="card-title">הוספת לקוח</h2></div></div>
      <div class="form">
        <div><label for="cName">שם הלקוח</label><input id="cName" placeholder="שם הלקוח"></div>
        <div><label for="cAmount">סכום ההלוואה (฿)</label><input id="cAmount" type="number" min="0" step="1"></div>
        <div><label for="cMonths">תקופה (חודשים)</label><input id="cMonths" type="number" min="1" step="1" value="12"></div>
        <button class="btn primary" id="addBtn">＋ הוסף לקוח</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h2 class="card-title">הלקוחות שלי</h2></div></div>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
const KEY="loan_portfolios_v3";
const OLD_KEY="loan_agent_manager_v1";
const $=id=>document.getElementById(id);
const money=n=>"฿"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function normalizeDb(x){
  if(!x||!Array.isArray(x.agents)) return null;
  let nextAgent=1,nextClient=1,nextRepayment=1;
  const agents=x.agents.map((a,ai)=>{
    const agentId=Number(a.id)||ai+1; nextAgent=Math.max(nextAgent,agentId+1);
    const clients=Array.isArray(a.clients)?a.clients.map((c,ci)=>{
      const clientId=Number(c.id)||nextClient; nextClient=Math.max(nextClient,clientId+1);
      const reps=Array.isArray(c.repayments)?c.repayments.map((r,ri)=>{
        const rid=Number(r.id)||nextRepayment; nextRepayment=Math.max(nextRepayment,rid+1);
        return {id:rid,amount:Math.max(0,Number(r.amount)||0),date:r.date||new Date().toISOString().slice(0,10),note:r.note||""};
      }):[];
      return {id:clientId,name:c.name||"לקוח",amount:Math.max(0,Number(c.amount)||0),months:Math.max(1,Number(c.months)||1),
        status:c.status||"פעיל",feeType:c.feeType||"agent",
        feeRate:(c.feeRate===null||c.feeRate===undefined||c.feeRate==="")?null:Math.max(0,Number(c.feeRate)||0),repayments:reps};
    }):[];
    return {id:agentId,name:a.name||("סוכן "+(ai+1)),monthlyFee:Math.max(0,Number(a.monthlyFee??a.fee)||0),
      agentShare:Math.max(0,Number(a.agentShare??a.agentFee)||0),budget:a.budget,feeSettings:a.feeSettings,monthLog:a.monthLog,clients};
  });
  return {agents,nextAgent,nextClient,nextRepayment};
}
let db=null;
try{db=normalizeDb(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){db=null}
if(!db){try{db=normalizeDb(JSON.parse(localStorage.getItem(OLD_KEY)||"null"));}catch(e){db=null}}

// כניסה זמנית לפי מזהה סוכן בקישור (?agent=ID). בשלב הבא תוחלף בכניסה במייל.
const agentId=new URLSearchParams(location.search).get("agent");
const a=db?db.agents.find(x=>String(x.id)===String(agentId)):null;

function getClientBalance(c){return Math.max(0,c.amount-c.repayments.reduce((x,r)=>x+r.amount,0))}
function getClientFeeRate(c,ag){return c.feeRate===null||c.feeRate===undefined?ag.monthlyFee:Number(c.feeRate)||0}
function getClientFeeType(c){return c.feeType&&c.feeType!=="agent"?c.feeType:"monthly"}
function getClientMonthlyGross(c,ag){const b=getClientBalance(c),r=getClientFeeRate(c,ag);return getClientFeeType(c)==="daily"?b*(r/100)*30.44:b*(r/100)}
function usedBudget(ag){return ag.clients.reduce((s,c)=>s+(Number(c.amount)||0),0)}
function remainingBudget(ag){return (Number(ag.budget)||0)-usedBudget(ag)}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  try{window.loanCloud?.syncNow?.()}catch(e){}
}

function render(){
  if(!a){$("noAgent").classList.remove("hidden");return}
  $("app").classList.remove("hidden");
  $("agentName").textContent=a.name;
  const bal=a.clients.reduce((s,c)=>s+getClientBalance(c),0);
  const share=a.clients.reduce((s,c)=>s+getClientMonthlyGross(c,a)*a.agentShare/100,0);
  const hasBudget=Number(a.budget)>0;
  $("kBudget").textContent=hasBudget?money(a.budget):"לא הוגדרה";
  $("kRemain").textContent=hasBudget?money(remainingBudget(a)):"—";
  $("kBal").textContent=money(bal);
  $("kShare").textContent=money(share);
  const list=$("list");
  if(!a.clients.length){list.innerHTML='<div class="empty">אין לקוחות בתיק עדיין</div>';return}
  list.innerHTML=a.clients.map(c=>{
    const b=getClientBalance(c);
    const status=b===0?"סגור":(c.status==="בעייתי"?"בעייתי":"פעיל");
    const part=getClientMonthlyGross(c,a)*a.agentShare/100;
    return '<div class="agent-client-row"><div><div class="agent-client-name">'+esc(c.name)+'</div>'+
      '<div class="agent-client-meta">'+status+' · הלוואה '+money(c.amount)+' · חלקך בחודש '+money(part)+'</div></div>'+
      '<div class="agent-client-balance">'+money(b)+'</div>'+
      '<button class="btn danger" data-id="'+c.id+'">הסר</button></div>';
  }).join("");
  list.querySelectorAll("button[data-id]").forEach(btn=>btn.onclick=()=>removeClient(Number(btn.dataset.id)));
}

function removeClient(id){
  const c=a.clients.find(x=>x.id===id);
  if(!c)return;
  if(!confirm("להסיר את "+c.name+" מהתיק? הפעולה תחזיר את הסכום לקופה.")) return;
  a.clients=a.clients.filter(x=>x.id!==id);
  save();render();
}

$("addBtn").onclick=()=>{
  const name=$("cName").value.trim();
  const amount=Math.max(0,Number($("cAmount").value)||0);
  const months=Math.max(1,Number($("cMonths").value)||1);
  if(!name||!amount){alert("יש להזין שם לקוח וסכום הלוואה.");return}
  if(Number(a.budget)>0&&amount>remainingBudget(a)){alert("אין מספיק קופה. נשאר: "+money(remainingBudget(a)));return}
  const id=db.nextClient||Math.max(0,...db.agents.flatMap(x=>x.clients.map(c=>c.id)))+1;
  db.nextClient=id+1;
  a.clients.push({id,name,amount,months,status:"פעיל",feeType:"agent",feeRate:null,repayments:[]});
  save();
  $("cName").value="";$("cAmount").value="";$("cMonths").value="12";
  render();
};

if(!a){
  $("noAgent").classList.remove("hidden");
  const pick=$("agentPick");
  if(!db||!db.agents.length){ $("pickHint").textContent="אין סוכנים עדיין. הוסף סוכנים במסך המנהל."; }
  else pick.innerHTML=db.agents.map(x=>'<a href="?agent='+encodeURIComponent(x.id)+'">'+esc(x.name)+'</a>').join("");
}
else render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="../supabase-sync.js?v=cloud-fix-20261003-6"></script>
</body>
</html>
