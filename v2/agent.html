<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>ידידים - סוכן</title>
<style>
  :root{--blue:#2563eb;--ink:#172033;--muted:#697386;--line:#e5e9f0;--green:#15945b;--shadow:0 10px 30px rgba(22,34,55,.07)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);font-size:16px;
    background:linear-gradient(180deg,#f5f0ff 0%,#fff1f7 55%,#effdf7 100%)}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;justify-content:flex-start;margin-bottom:12px}
  .btn{min-height:44px;padding:10px 16px;border:0;border-radius:16px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn.light{background:#fff;color:#7c3aed;box-shadow:0 3px 10px rgba(124,58,237,.15)}
  .btn.soft{background:linear-gradient(135deg,#fef3c7,#fce7f3);color:#7c2d12;min-height:38px;padding:8px 12px;font-size:13px}
  .btn.soft:hover{filter:brightness(1.03)}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 20px rgba(42,29,74,.08);margin-bottom:16px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .card-title{font-size:22px;font-weight:900;margin:0;color:#4c1d95}
  .card-sub{color:var(--muted);font-size:14px;line-height:1.5;margin-top:5px}
  .agent-totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .agent-totals div{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:10px}
  .agent-totals span{display:block;font-size:12px;color:var(--muted)}
  .agent-totals b{display:block;font-size:17px;margin-top:4px}
  @media(min-width:800px){.agent-totals{grid-template-columns:repeat(4,1fr)}}
  .agent-totals div{border:0;color:#fff;border-radius:16px;box-shadow:0 8px 16px rgba(42,29,74,.12)}
  .agent-totals div span{color:rgba(255,255,255,.92)}
  .agent-totals div:nth-child(4n+1){background:linear-gradient(135deg,#f59e0b,#f97316)}
  .agent-totals div:nth-child(4n+2){background:linear-gradient(135deg,#22c55e,#16a34a)}
  .agent-totals div:nth-child(4n+3){background:linear-gradient(135deg,#3b82f6,#06b6d4)}
  .agent-totals div:nth-child(4n+4){background:linear-gradient(135deg,#ec4899,#a855f7)}
  .agent-clients{border:0;background:linear-gradient(135deg,#ede9fe,#fdf2f8);border-radius:18px;padding:8px 12px}
  .agent-client-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px 6px;border-bottom:1px solid rgba(124,58,237,.15)}
  .agent-client-row:last-child{border-bottom:0}
  .agent-client-name{font-weight:800;font-size:15px}
  .agent-client-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .agent-client-balance{font-size:14px;font-weight:800;white-space:nowrap;color:#15803d}
  .empty{color:var(--muted);text-align:center;padding:20px 6px;font-size:15px}
  .agent-pick{display:grid;gap:8px}
  .agent-pick a{display:block;text-align:center;padding:12px;border-radius:16px;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,#fde68a,#fbcfe8);font-weight:800}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="btn light" href="./index.html">→ חזרה לכניסה</a></div>

  <div id="noAgent" class="card hidden">
    <div class="card-head"><div><h2 class="card-title">תיקי סוכנים</h2><div class="card-sub" id="pickHint">בחר סוכן כדי לפתוח את התיק שלו.</div></div></div>
    <div id="agentPick" class="agent-pick"></div>
  </div>

  <div id="app" class="hidden">
    <div id="budgetBox"></div>
    <div class="card">
      <div class="card-head"><div><h2 class="card-title" id="agentClientsTitle"></h2><div class="card-sub" id="agentClientsSub"></div></div></div>
      <div id="totalBox"></div>
      <div id="agentClientsList"></div>
    </div>
  </div>
</div>

<script>
const KEY="loan_portfolios_v3";
const OLD_KEY="loan_agent_manager_v1";
const $=id=>document.getElementById(id);
const money=n=>"฿"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function normalizeDb(x){
  if(!x||!Array.isArray(x.agents)) return null;
  let nextClient=1,nextRepayment=1;
  const agents=x.agents.map((a,ai)=>{
    const agentId=Number(a.id)||ai+1;
    const clients=Array.isArray(a.clients)?a.clients.map(c=>{
      const clientId=Number(c.id)||nextClient; nextClient=Math.max(nextClient,clientId+1);
      const reps=Array.isArray(c.repayments)?c.repayments.map(r=>{
        const rid=Number(r.id)||nextRepayment; nextRepayment=Math.max(nextRepayment,rid+1);
        return {id:rid,amount:Math.max(0,Number(r.amount)||0),date:r.date||"",note:r.note||""};
      }):[];
      return {id:clientId,name:c.name||"לקוח",amount:Math.max(0,Number(c.amount)||0),months:Math.max(1,Number(c.months)||1),
        status:c.status||"פעיל",feeType:c.feeType||"agent",
        feeRate:(c.feeRate===null||c.feeRate===undefined||c.feeRate==="")?null:Math.max(0,Number(c.feeRate)||0),repayments:reps};
    }):[];
    return {id:agentId,name:a.name||("סוכן "+(ai+1)),monthlyFee:Math.max(0,Number(a.monthlyFee??a.fee)||0),
      agentShare:Math.max(0,Number(a.agentShare??a.agentFee)||0),budget:a.budget,clients};
  });
  return {agents};
}
let db=null;
try{db=normalizeDb(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){db=null}
if(!db){try{db=normalizeDb(JSON.parse(localStorage.getItem(OLD_KEY)||"null"));}catch(e){db=null}}

// כניסה זמנית לפי מזהה סוכן בקישור (?agent=ID). בשלב הבא תוחלף בכניסה במייל.
const agentId=new URLSearchParams(location.search).get("agent");
const a=db?db.agents.find(x=>String(x.id)===String(agentId)):null;

function getClientBalance(c){return Math.max(0,c.amount-c.repayments.reduce((x,r)=>x+r.amount,0))}
function getClientFeeRate(c,ag){return c.feeRate===null||c.feeRate===undefined?ag.monthlyFee:Number(c.feeRate)||0}
function getClientFeeType(c){return c.feeType&&c.feeType!=="agent"?c.feeType:"monthly"}
function getClientMonthlyGross(c,ag){const b=getClientBalance(c),r=getClientFeeRate(c,ag);return getClientFeeType(c)==="daily"?b*(r/100)*30.44:b*(r/100)}
function usedBudget(ag){return ag.clients.reduce((s,c)=>s+(Number(c.amount)||0),0)}
function remainingBudget(ag){return (Number(ag.budget)||0)-usedBudget(ag)}

function render(){
  if(!a){$("noAgent").classList.remove("hidden");return}
  $("app").classList.remove("hidden");
  $("agentClientsTitle").textContent="לקוחות של "+a.name;
  $("agentClientsSub").textContent=a.clients.length+" לווים";
  // מה שהסוכנת רואה: היתרות וחלקה בלבד. עמלת המנהל וחלקו לא מוצגים.
  const rows=a.clients.map(c=>{const bal=getClientBalance(c),g=getClientMonthlyGross(c,a),ag=g*a.agentShare/100;return {c,bal,ag}});
  const tot=rows.reduce((t,r)=>({bal:t.bal+r.bal,ag:t.ag+r.ag}),{bal:0,ag:0});
  const budgetBox=a.budget>0?'<div class="agent-totals"><div><span>קופה</span><b>'+money(Number(a.budget))+'</b></div><div><span>נשאר בקופה</span><b>'+money(remainingBudget(a))+'</b></div></div>':'';
  $("budgetBox").innerHTML=budgetBox;
  $("totalBox").innerHTML='<div class="agent-totals"><div><span>יתרות</span><b>'+money(tot.bal)+'</b></div><div><span>חלק הסוכנת חודשי</span><b>'+money(tot.ag)+'</b></div></div>';
  const el=$("agentClientsList");
  if(!a.clients.length){el.innerHTML='<div class="empty">אין לווים בתיק זה</div>';return}
  el.innerHTML='<div class="agent-clients">'+rows.map(r=>{
    const status=r.bal===0?"סגור":(r.c.status==="בעייתי"?"בעייתי":"פעיל");
    return '<div class="agent-client-row"><div><div class="agent-client-name">'+esc(r.c.name)+'</div>'+
      '<div class="agent-client-meta">'+status+' · הלוואה מקורית '+money(r.c.amount)+' · חלקך בחודש '+money(r.ag)+'</div></div>'+
      '<div class="agent-client-balance">'+money(r.bal)+'</div></div>';
  }).join("")+'</div>';
}

if(!a){
  $("noAgent").classList.remove("hidden");
  const pick=$("agentPick");
  if(!db||!db.agents.length){ $("pickHint").textContent="אין סוכנים עדיין. הוסף סוכנים במסך המנהל."; }
  else pick.innerHTML=db.agents.map(x=>'<a href="?agent='+encodeURIComponent(x.id)+'">'+esc(x.name)+'</a>').join("");
}
else render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="../supabase-sync.js?v=cloud-fix-20261003-6"></script>
</body>
</html>
